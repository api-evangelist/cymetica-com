openapi: 3.2.0
info:
  title: EventTrader Public CEO AI Leaderboard API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: CEO AI Leaderboard
paths:
  /api/v1/ceo-ai-leaderboard:
    get:
      tags:
      - CEO AI Leaderboard
      summary: Leaderboard
      description: Ranked board. ``sector`` omitted returns the combined top ``limit``.
      operationId: leaderboard_api_v1_ceo_ai_leaderboard_get
      parameters:
      - name: sector
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: crypto | general | omit for both
          title: Sector
        description: crypto | general | omit for both
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  sector:
                    type: string
                    description: crypto | general | all
                  count:
                    type: integer
                  totals:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: integer
                    description: sector → published profiles
                  rubric:
                    type: object
                    properties:
                      rubric_version:
                        type: integer
                      dimensions:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            max:
                              type: integer
                            description:
                              type: string
                            group:
                              type: string
                            added_in:
                              type: integer
                          additionalProperties: true
                      dimension_labels:
                        type: object
                        properties: {}
                        additionalProperties:
                          type: string
                      anchors:
                        type: object
                        properties: {}
                        additionalProperties: true
                      anchors_by_dimension:
                        type: object
                        properties: {}
                        additionalProperties: true
                      weighting:
                        type: object
                        properties:
                          formula:
                            type: string
                        additionalProperties: true
                      penalties:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            max:
                              type: integer
                            description:
                              type: string
                          additionalProperties: true
                      penalty_rule:
                        type: string
                      score_formula:
                        type: string
                      max_score:
                        type: integer
                      tiers:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            min_score:
                              type: integer
                            description:
                              type: string
                          additionalProperties: true
                      sectors:
                        type: array
                        items:
                          type: string
                      min_confidence_to_publish:
                        type: number
                    additionalProperties: true
                    description: Machine-readable scoring rubric.
                  dimension_labels:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                  export:
                    type: string
                  methodology:
                    type: string
                  generated_at:
                    type: string
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        slug:
                          type: string
                        name:
                          type: string
                        title:
                          type:
                          - string
                          - 'null'
                        company:
                          type:
                          - string
                          - 'null'
                        sector:
                          type: string
                          description: crypto | general
                        profile_url:
                          type:
                          - string
                          - 'null'
                        image_url:
                          type:
                          - string
                          - 'null'
                        score:
                          type: integer
                          description: 0-100 final score = max(0, weighted_score - penalties).
                        tier:
                          type: string
                        dimensions:
                          type: object
                          properties: {}
                          additionalProperties:
                            type: integer
                          description: dimension key → 0-20 score
                        rubric_version:
                          type:
                          - integer
                          - 'null'
                        weighted_score:
                          type:
                          - number
                          - 'null'
                        penalties:
                          type: object
                          properties: {}
                          additionalProperties: true
                          description: penalty key → 0-10
                        rationale:
                          type:
                          - string
                          - 'null'
                        evidence:
                          type: array
                          items:
                            type: object
                            properties:
                              claim:
                                type: string
                              source_url:
                                type: string
                            additionalProperties: true
                        confidence:
                          type: number
                        source:
                          type: string
                          description: seeded | community
                        status:
                          type: string
                        scored_at:
                          type:
                          - string
                          - 'null'
                        rank:
                          type: integer
                      additionalProperties: true
                      required:
                      - slug
                      - name
                      - score
                      - tier
                      - rank
                additionalProperties: false
                required:
                - sector
                - count
                - entries
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
