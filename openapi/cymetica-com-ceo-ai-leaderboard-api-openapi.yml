  /api/v1/ceo-ai-leaderboard/score:
    post:
      tags:
      - CEO AI Leaderboard
      summary: Score Profile
      description: 'Score one founder / CEO profile URL. Built for agents: returns the

        result (200) when it finishes within ``wait`` seconds, otherwise 202 with

        a status URL to poll. Same URL within 7 days → cached 200.'
      operationId: score_profile_api_v1_ceo_ai_leaderboard_score_post
      parameters:
      - name: wait
        in: query
        required: false
        schema:
          type: integer
          maximum: 55
          minimum: 0
          default: 45
          title: Wait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type:
                    - string
                    - 'null'
                  title:
                    type:
                    - string
                    - 'null'
                  company:
                    type:
                    - string
                    - 'null'
                  sector:
                    type:
                    - string
                    - 'null'
                  dimensions:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: integer
                    description: dimension key → 0-20 score
                  score:
                    type: integer
                    description: 0-100 = max(0, weighted_score - penalties).
                  tier:
                    type: string
                  tier_label:
                    type: string
                  rationale:
                    type:
                    - string
                    - 'null'
                  evidence:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                  confidence:
                    type: number
                  image_url:
                    type:
                    - string
                    - 'null'
                  profile_url:
                    type:
                    - string
                    - 'null'
                  duration_ms:
                    type:
                    - integer
                    - 'null'
                  cached:
                    type:
                    - boolean
                    - 'null'
                    description: true = a saved scoring of the same URL (7 days) was served.
                  rubric_version:
                    type: integer
                  weighted_score:
                    type:
                    - number
                    - 'null'
                  penalties:
                    type: object
                    properties: {}
                    additionalProperties: true
                  penalty_evidence:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                  metadata:
                    type: object
                    properties: {}
                    additionalProperties: true
                  dimension_labels:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                  published:
                    type: boolean
                    description: true = this person is on the public board.
                  slug:
                    type:
                    - string
                    - 'null'
                  leaderboard_url:
                    type:
                    - string
                    - 'null'
                additionalProperties: true
                required:
                - score
                - tier
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '202':
          description: Scoring still running after `wait` seconds (default 45, max 55). Poll `status_url`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: '`pending`.'
                  message:
                    type: string
                  url:
                    type: string
                  status_url:
                    type: string
                    description: Poll this until the result is ready.
                  retry_after_seconds:
                    type: integer
                additionalProperties: true
                required:
                - status
                - status_url
        '400':
          description: Missing, over-long or non-public URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '429':
          description: Three new scorings per hour per IP; Retry-After is set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '503':
          description: Scoring is busy; retry in a few minutes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ScoreRequest:
      properties:
        url:
          type: string
          title: Url
          description: Profile URL of the founder / CEO
      type: object
      required:
      - url
      title: ScoreRequest
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
