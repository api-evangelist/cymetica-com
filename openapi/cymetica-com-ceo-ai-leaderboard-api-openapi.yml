                  rationale:
                    type:
                    - string
                    - 'null'
                  evidence:
                    type: array
                    items:
                      type: object
                      properties:
                        claim:
                          type: string
                        source_url:
                          type: string
                      additionalProperties: true
                  confidence:
                    type: number
                  source:
                    type: string
                    description: seeded | community
                  status:
                    type: string
                  scored_at:
                    type:
                    - string
                    - 'null'
                  rank:
