openapi: 3.2.0
info:
  title: EventTrader Public Asset Universe API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Asset Universe
paths:
  /api/v1/universe/movers:
    get:
      tags:
      - Asset Universe
      summary: Top Movers
      description: 'Top trailing returns across the PRICEABLE subset of the universe.


        Reads the precomputed ``universe_return_snapshots`` board — an indexed

        ORDER BY over the chosen window — so it never live-prices the catalog.

        Honest about coverage: ``ranked`` is how many vehicles actually had fresh

        price history for this window (NOT the ~74k catalog total), and ``as_of``

        is the snapshot age; a caller can show both so the board never implies the

        whole universe was priced. ``direction=losers`` flips to the worst returns.'
      operationId: top_movers_api_v1_universe_movers_get
      parameters:
      - name: window
        in: query
        required: false
        schema:
          type: string
          default: 30d
          title: Window
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      - name: direction
        in: query
        required: false
        schema:
          type: string
          default: gainers
          title: Direction
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  window:
                    type: string
                    enum:
                    - 1d
                    - 7d
                    - 30d
                  direction:
                    type: string
                    description: '`losers` = worst returns first; anything else = gainers.'
                  movers:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                        symbol:
                          type: string
                        name:
                          type: string
                        asset_class:
                          type:
                          - string
                          - 'null'
                        ontology_class:
                          type:
                          - string
                          - 'null'
                        ret_1d:
                          type:
                          - number
                          - 'null'
                        ret_7d:
                          type:
                          - number
                          - 'null'
                        ret_30d:
                          type:
                          - number
                          - 'null'
                        last_price_usd:
                          type:
                          - number
                          - 'null'
                        vehicle_url:
                          type: string
                      additionalProperties: false
                      required:
                      - rank
                      - symbol
                      description: Trailing returns are percentages.
                  ranked_count:
                    type: integer
                    description: Vehicles with fresh history for this window (NOT the catalog total).
                  as_of:
                    type:
                    - string
                    - 'null'
                additionalProperties: false
                required:
                - window
                - direction
                - movers
                - ranked_count
                - as_of
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/universe/movers/community:
    get:
      tags:
      - Asset Universe
      summary: Community Movers
      description: 'Top 30-day crypto movers that have a Telegram/Discord community, with the

        pro-terminal URL for each. Same stored closes as /movers; never live-priced.'
      operationId: community_movers_api_v1_universe_movers_community_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 25
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  window:
                    type: string
                    enum:
                    - 30d
                  movers:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                        symbol:
                          type: string
                        name:
                          type:
                          - string
                          - 'null'
                        ontology_class:
                          type:
                          - string
                          - 'null'
                        ret_30d:
                          type: number
                          description: 30-day return, %.
                        last_price_usd:
                          type:
                          - number
                          - 'null'
                        telegram:
                          anyOf:
                          - type: object
                            properties:
                              handle:
                                type: string
                              url:
                                type: string
                              join_state:
                                type: string
                            additionalProperties: false
                          - type: 'null'
                        discord:
                          anyOf:
                          - type: object
                            properties:
                              handle:
                                type: string
                              url:
                                type: string
                              join_state:
                                type: string
                            additionalProperties: false
                          - type: 'null'
                        vehicle_url:
                          type: string
                        terminal_registered:
                          type: boolean
                        terminal_url:
                          type:
                          - string
                          - 'null'
                      additionalProperties: false
                      required:
                      - rank
                      - symbol
                      - ret_30d
                  count:
                    type: integer
                additionalProperties: false
                required:
                - window
                - movers
                - count
                description: Top 30-day crypto movers that have a Telegram/Discord community.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/universe/movers/potential:
    get:
      tags:
      - Asset Universe
      summary: Potential Movers
      description: 'Potential Movers — the day''s screened picks plus their MEASURED track

        record (feature-leaderboard #727 / #728).


        Picks are recorded the day they are made, before the outcome is known; a

        week later the forward 7-day return is filled from stored closes. The

        response reports hit rates from scored rows only, live and backtest kept

        separate, each next to the whole-universe base rate. Not a recommendation;

        nothing here promises a return.'
      operationId: potential_movers_api_v1_universe_movers_potential_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  screen:
                    type: object
                    properties:
                      name:
                        type: string
                      rule:
                        type: string
                      top_n:
                        type: integer
                      hit_threshold_pct:
                        type: number
                      soft_hit_threshold_pct:
                        type: number
                    additionalProperties: false
                  as_of:
                    type:
                    - string
                    - 'null'
                  source:
                    type:
                    - string
                    - 'null'
                  universe_n:
                    type: integer
                  picks:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                        symbol:
                          type: string
                        name:
                          type: string
                        asset_class:
                          type:
                          - string
                          - 'null'
                        score:
                          type:
                          - number
                          - 'null'
                        entry_price_usd:
                          type:
                          - number
                          - 'null'
                        ret_1d:
                          type:
                          - number
                          - 'null'
                        ret_7d:
                          type:
                          - number
                          - 'null'
                        ret_30d:
                          type:
                          - number
                          - 'null'
                        fwd_7d_ret:
                          type:
                          - number
                          - 'null'
                        vehicle_url:
                          type: string
                      additionalProperties: true
                      required:
                      - rank
                      - symbol
                  track_record:
                    type: object
                    properties:
                      live:
                        type: object
                        properties:
                          scored:
                            type: integer
                          hit100:
                            type: integer
                          hit50:
                            type: integer
                          hit100_pct:
                            type:
                            - number
                            - 'null'
                          hit50_pct:
                            type:
                            - number
                            - 'null'
                          median_pct:
                            type:
                            - number
                            - 'null'
                          mean_pct:
                            type:
                            - number
                            - 'null'
                          runs_scored:
                            type: integer
                          first_anchor:
                            type:
                            - string
                            - 'null'
                          last_anchor:
                            type:
                            - string
                            - 'null'
                          runs_with_a_double:
                            type: integer
                          pending_picks:
                            type: integer
                          base_hit100_pct:
                            type:
                            - number
                            - 'null'
                          base_hit50_pct:
                            type:
                            - number
                            - 'null'
                          base_median_pct:
                            type:
                            - number
                            - 'null'
                        additionalProperties: true
                        description: Measured forward 7-day outcomes of scored picks vs the whole-universe base rate.
                      backtest:
                        type: object
                        properties:
                          scored:
                            type: integer
                          hit100:
                            type: integer
                          hit50:
                            type: integer
                          hit100_pct:
                            type:
                            - number
                            - 'null'
                          hit50_pct:
                            type:
                            - number
                            - 'null'
                          median_pct:
                            type:
                            - number
                            - 'null'
                          mean_pct:
                            type:
                            - number
                            - 'null'
                          runs_scored:
                            type: integer
                          first_anchor:
                            type:
                            - string
                            - 'null'
                          last_anchor:
                            type:
                            - string
                            - 'null'
                          runs_with_a_double:
                            type: integer
                          pending_picks:
                            type: integer
                          base_hit100_pct:
                            type:
                            - number
                            - 'null'
                          base_hit50_pct:
                            type:
                            - number
                            - 'null'
                          base_median_pct:
                            type:
                            - number
                            - 'null'
                        additionalProperties: true
                        description: Measured forward 7-day outcomes of scored picks vs the whole-universe base rate.
                    additionalProperties: false
                    description: Empty object when the record cannot be read.
                  liquid:
                    type: object
                    properties: {}
                    additionalProperties: true
                    description: The liquidity-floored variant of the screen (screen, picks, track_record, disclaimer); empty when unavailable.
                  disclaimer:
                    type: string
                additionalProperties: true
                required:
                - screen
                - picks
                - track_record
                - disclaimer
                description: The day's screened picks plus their measured track record. Returns are percentages.
      security: []
  /api/v1/universe/movers/tournament:
    get:
      tags:
      - Asset Universe
      summary: Movers Tournament
      description: 'Movers Tournament (feature-leaderboard #729): current round, leaderboard

        of traders ranked on the real 7-day return of their picks (the NEXUS screen

        competes as a row), and — when signed in OR calling with a user API key —

        the caller''s own entries (ET-25009).

        Scoreboard only: no prizes, nothing moves money.'
      operationId: movers_tournament_api_v1_universe_movers_tournament_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: object
                    properties:
                      max_picks:
                        type: integer
                      window_days:
                        type: integer
                      text:
                        type: string
                    additionalProperties: false
                  round:
                    type: object
                    properties:
                      round_anchor:
                        type:
                        - string
                        - 'null'
                      entries:
                        type: integer
                      traders:
                        type: integer
                      scores_after:
                        type: string
                      closes_at:
                        type:
                        - string
                        - 'null'
                      entries_close_at:
                        type:
                        - string
                        - 'null'
                      entries_open:
                        type: boolean
                    additionalProperties: false
                    required:
                    - round_anchor
                    - entries
                    - traders
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        handle:
                          type: string
                        picks:
                          type: integer
                        rounds:
                          type: integer
                        avg_pct:
                          type: number
                        median_pct:
                          type: number
                        best_pct:
                          type: number
                        doublers:
                          type: integer
                        hit50:
                          type: integer
                        basis:
                          type: string
                          enum:
                          - live
                          - backtest
                        rank:
                          type: integer
                        is_house:
                          type: boolean
                      additionalProperties: false
                  my_entries:
                    type: array
                    items:
                      type: object
                      properties:
                        round_anchor:
                          type: string
                        symbol:
                          type: string
                        asset_class:
                          type:
                          - string
                          - 'null'
                        name:
                          type: string
                        entry_price_usd:
                          type:
                          - number
                          - 'null'
                        fwd_7d_ret:
                          type:
                          - number
                          - 'null'
                          description: Forward 7-day return, %; null until scored.
                        vehicle_url:
                          type: string
                      additionalProperties: false
                      required:
                      - round_anchor
                      - symbol
                additionalProperties: false
                required:
                - rules
                - round
                - leaderboard
                - my_entries
                description: Movers Tournament scoreboard; `my_entries` is filled only for a signed-in caller or user API key.
      security: []
  /api/v1/universe/movers/tournament/enter:
    post:
      tags:
      - Asset Universe
      summary: Movers Tournament Enter
      description: 'Lock up to five universe symbols into the current round at their stored

        close. Rejects unknown/unpriced symbols with a plain reason (422).


        Auth: a signed-in session (JWT / cookie) OR a user API key (X-API-Key:

        evt_...), so agents can enter picks the way /api-docs describes

        (ET-25009 — the route previously accepted sessions only).'
      operationId: movers_tournament_enter_api_v1_universe_movers_tournament_enter_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentEntryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  round_anchor:
                    type: string
                  added:
                    type: array
                    items:
                      type: string
                  already_entered:
                    type: array
                    items:
                      type: string
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        round_anchor:
                          type: string
                        symbol:
                          type: string
                        asset_class:
                          type:
                          - string
                          - 'null'
                        name:
                          type: string
                        entry_price_usd:
                          type:
                          - number
                          - 'null'
                        fwd_7d_ret:
                          type:
                          - number
                          - 'null'
                          description: Forward 7-day return, %; null until scored.
                        vehicle_url:
                          type: string
                      additionalProperties: false
                      required:
                      - round_anchor
                      - symbol
                additionalProperties: false
                required:
                - round_anchor
                - added
                - already_entered
                - entries
                description: Picks locked into the current round. Unknown/unpriced symbols answer 422 with the reason.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: Tournament temporarily unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TournamentEntryRequest:
      properties:
        symbols:
          items:
            type: string
          type: array
          maxItems: 20
          minItems: 1
          title: Symbols
      type: object
      required:
      - symbols
      title: TournamentEntryRequest
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Account session JWT (from /auth/login). Key-management routes accept only this — never an API key.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://cymetica.com/oauth/authorize
          tokenUrl: https://cymetica.com/oauth/token
          scopes:
            read: Read public and account data
            portfolio: Read portfolio positions
            trade: Place and cancel orders
x-provenance:
  method: harvested
  publisher: Cymetica
  source: https://cymetica.com/openapi-public.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
