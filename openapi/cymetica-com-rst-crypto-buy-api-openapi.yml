openapi: 3.2.0
info:
  title: EventTrader Public Rst Crypto Buy API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: rst-crypto-buy
paths:
  /api/v1/rst/supported-tokens:
    get:
      tags:
      - rst-crypto-buy
      summary: Get Supported Tokens
      description: Every token accepted for ET10 purchase. Each entry carries `comingSoon` (true = not yet payable) and `paymentMethod`; the available and coming-soon counts change with the live registry, so count them from the response rather than from this document.
      operationId: get_supported_tokens_api_v1_rst_supported_tokens_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type:
                          - integer
                          - 'null'
                        symbol:
                          type: string
                        name:
                          type: string
                        address:
                          type:
                          - string
                          - 'null'
                        decimals:
                          type: integer
                        chain:
                          type: string
                        chain_id:
                          type:
                          - integer
                          - 'null'
                        category:
                          type: string
                        coingeckoId:
                          type:
                          - string
                          - 'null'
                        comingSoon:
                          type: boolean
                        paymentMethod:
                          type: string
                          description: e.g. evm_swap; pending/native_chain = not yet payable.
                        logoUrl:
                          type:
                          - string
                          - 'null'
                      additionalProperties: false
                      required:
                      - symbol
                      - name
                      - decimals
                      - chain
                      - comingSoon
                      - paymentMethod
                  rst_price_usd:
                    type: string
                    description: Current ET10 sale price in USD (promo price while a promo is open).
                  et10_promo:
                    type: object
                    properties:
                      active:
                        type: boolean
                      price_usd:
                        type: string
                      base_price_usd:
                        type: string
                      et10_per_usdc:
                        type: string
                      base_et10_per_usdc:
                        type: string
                      discount_pct:
                        type: string
                      ends_at:
                        type: string
                      starts_at:
                        type:
                        - string
                        - 'null'
                      purpose:
                        type: string
                      topup_bonus:
                        type: object
                        properties:
                          active:
                            type: boolean
                          summary:
                            type: string
                        additionalProperties: false
                        required:
                        - active
                        - summary
                        description: Buying during the promo reprices the buyer's earlier full-price ET10 (credited once).
                    additionalProperties: false
                    required:
                    - active
                    - price_usd
                    - base_price_usd
                    - et10_per_usdc
                    - base_et10_per_usdc
                    description: ET10 sale-price promo. discount_pct/ends_at/starts_at/purpose/topup_bonus are present only while `active` is true.
                additionalProperties: false
                required:
                - tokens
                - rst_price_usd
                - et10_promo
                description: Tokens accepted for ET10 purchase (cacheable 5 min).
        '429':
          description: Too many requests (30/min per IP).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security: []
  /api/v1/rst/exchange-address/{token_symbol}:
    get:
      tags:
      - rst-crypto-buy
      summary: Get Exchange Address
      description: 'Get the deposit address for exchanging a token for RST.


        Public endpoint — no auth required. Returns the platform''s collection

        address for the token''s chain. Send crypto there, RST is sent back to

        the sender''s address automatically.'
      operationId: get_exchange_address_api_v1_rst_exchange_address__token_symbol__get
      parameters:
      - name: token_symbol
        in: path
        required: true
        schema:
          type: string
          title: Token Symbol
      - name: chain_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Chain ID to disambiguate tokens on multiple chains (e.g. USDC on Ethereum vs Base)
          title: Chain Id
        description: Chain ID to disambiguate tokens on multiple chains (e.g. USDC on Ethereum vs Base)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit_address:
                    type: string
                  chain:
                    type: string
                  chain_id:
                    type: integer
                  token_symbol:
                    type: string
                  rst_price_usd:
                    type: string
                  paymentMethod:
                    type: string
                additionalProperties: false
                required:
                - deposit_address
                - chain
                - chain_id
                - token_symbol
                - rst_price_usd
                description: 'Collection address for this token''s chain: send the token there and ET10 is sent back to the sender.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: Invalid or unsupported token symbol, or the token is not payable yet (coming soon).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '429':
          description: Too many requests (30/min per IP).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '503':
          description: No collection address is available for that chain right now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Account session JWT (from /auth/login). Key-management routes accept only this — never an API key.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://cymetica.com/oauth/authorize
          tokenUrl: https://cymetica.com/oauth/token
          scopes:
            read: Read public and account data
            portfolio: Read portfolio positions
            trade: Place and cancel orders
