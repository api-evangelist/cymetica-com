openapi: 3.2.0
info:
  title: EventTrader Public Crypto Dashboards API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Crypto Dashboards
paths:
  /api/v1/crypto:
    get:
      tags:
      - Crypto Dashboards
      summary: Crypto Manifest
      operationId: crypto_manifest_api_v1_crypto_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: integer
                  count:
                    type: integer
                  coins:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        s:
                          type: string
                          description: Ticker.
                        n:
                          type: string
                          description: Name.
                        p:
                          type:
                          - number
                          - 'null'
                          description: Price, USD.
                        c24:
                          type:
                          - number
                          - 'null'
                        c7:
                          type:
                          - number
                          - 'null'
                        mc:
                          type:
                          - number
                          - 'null'
                          description: Market cap, USD.
                        v:
                          type:
                          - number
                          - 'null'
                        r:
                          type:
                          - integer
                          - 'null'
                          description: Rank in today's top 100.
                        top:
                          type: boolean
                        sp:
                          type: number
                          description: Belief network strength, when the meter has a reading.
                        em:
                          type: number
                          description: Crowd emotion, when the meter has a reading.
                        mood:
                          type: string
                        au:
                          type: integer
                        bz:
                          type: number
                          description: Buzz 0-100, when the meter has a reading.
                        m24:
                          type: integer
                      additionalProperties: true
                      required:
                      - slug
                      - s
                      - n
                additionalProperties: true
                required:
                - generated_at
                - count
                - coins
                description: Every coin that has a dashboard.
        '503':
          description: The first snapshot is still being collected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security: []
  /api/v1/crypto/status:
    get:
      tags:
      - Crypto Dashboards
      summary: Crypto Status
      operationId: crypto_status_api_v1_crypto_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type:
                    - integer
                    - 'null'
                  age_seconds:
                    type:
                    - integer
                    - 'null'
                  stats_every_seconds:
                    type: integer
                  universe_every_seconds:
                    type: integer
                  stale_after_seconds:
                    type: integer
                  counts:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: integer
                  sources:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                additionalProperties: true
                description: When the dashboards were last collected, and how many.
      security: []
  /api/v1/crypto/search:
    get:
      tags:
      - Crypto Dashboards
      summary: Crypto Search
      description: 'Coins matching a ticker or name. With ``build=true`` (the default) the best match

        that has no dashboard yet starts building and its future URL is returned.'
      operationId: crypto_search_api_v1_crypto_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 60
          title: Q
      - name: build
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Build
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        symbol:
                          type: string
                        name:
                          type:
                          - string
                          - 'null'
                        status:
                          type: string
                          enum:
                          - ready
                          - buildable
                          - building
                        url:
                          type: string
                        api_url:
                          type: string
                        price:
                          type:
                          - number
                          - 'null'
                        market_cap:
                          type:
                          - number
                          - 'null'
                      additionalProperties: true
                      required:
                      - slug
                      - symbol
                      - status
                      - url
                  next_actions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        href:
                          type: string
                        prefill:
                          type: string
                      additionalProperties: true
                  building:
                    type: object
                    properties:
                      slug:
                        type: string
                      url:
                        type: string
                      ready_in_seconds:
                        type: integer
                      message:
                        type: string
                    additionalProperties: true
                additionalProperties: true
                required:
                - query
                - results
                description: Coins matching a ticker or a name.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/crypto/alerts/kinds:
    get:
      tags:
      - Crypto Dashboards
      summary: Crypto Alert Kinds
      operationId: crypto_alert_kinds_api_v1_crypto_alerts_kinds_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                  max_active_per_agent:
                    type: integer
                  cooldown_seconds:
                    type: integer
                  checked_every_seconds:
                    type: integer
                  webhook_event:
                    type: string
                  delivery:
                    type: array
                    items:
                      type: string
                additionalProperties: true
                required:
                - kinds
                description: The alerts our system can send to your agent.
      security: []
  /api/v1/crypto/alerts:
    get:
      tags:
      - Crypto Dashboards
      summary: Crypto Alerts List
      operationId: crypto_alerts_list_api_v1_crypto_alerts_get
      parameters:
      - name: slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Slug
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        slug:
                          type: string
                        kind:
                          type: string
                        threshold:
                          type: number
                        note:
                          type:
                          - string
                          - 'null'
                        repeat:
                          type: boolean
                        active:
                          type: boolean
                        trigger_count:
                          type: integer
                        last_triggered_at:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                      required:
                      - id
                      - slug
                      - kind
                      - threshold
                additionalProperties: true
                required:
                - alerts
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No X-API-Key of a registered agent. Register at POST /mcp/v1/register.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
    post:
      tags:
      - Crypto Dashboards
      summary: Crypto Alert Create
      description: 'Body: {"slug": "sol", "kind": "price_above", "threshold": 200, "note": "...", "repeat": false}.'
      operationId: crypto_alert_create_api_v1_crypto_alerts_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    type: object
                    properties:
                      id:
                        type: integer
                      slug:
                        type: string
                      kind:
                        type: string
                      threshold:
                        type: number
                      note:
                        type:
                        - string
                        - 'null'
                      repeat:
                        type: boolean
                      active:
                        type: boolean
                      trigger_count:
                        type: integer
                      last_triggered_at:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type:
                        - string
                        - 'null'
                    additionalProperties: true
                    required:
                    - id
                    - slug
                    - kind
                    - threshold
                  checked_every_seconds:
                    type: integer
                  read_at:
                    type: string
                  current:
                    type: object
                    properties:
                      price:
                        type:
                        - number
                        - 'null'
                      change_24h:
                        type:
                        - number
                        - 'null'
                      market_cap:
                        type:
                        - number
                        - 'null'
                    additionalProperties: true
                additionalProperties: true
                required:
                - alert
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: 'No dashboard for that coin yet. Search first: GET /api/v1/crypto/search?q=<ticker or name>.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '401':
          description: No X-API-Key of a registered agent. Register at POST /mcp/v1/register.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '409':
          description: This agent already has 50 active alerts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
  /api/v1/crypto/alerts/{alert_id}:
    delete:
      tags:
      - Crypto Dashboards
      summary: Crypto Alert Delete
      operationId: crypto_alert_delete_api_v1_crypto_alerts__alert_id__delete
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: integer
          title: Alert Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                additionalProperties: false
                required:
                - ok
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No X-API-Key of a registered agent. Register at POST /mcp/v1/register.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '404':
          description: No such alert of this agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
  /api/v1/crypto/alerts/inbox:
    get:
      tags:
      - Crypto Dashboards
      summary: Crypto Alerts Inbox
      description: 'Alerts that fired for this agent, oldest first. Pass the returned ``last_id`` as

        ``after_id`` next time. ``peek=true`` leaves them unread.'
      operationId: crypto_alerts_inbox_api_v1_crypto_alerts_inbox_get
      parameters:
      - name: after_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: After Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: peek
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Peek
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        alert_id:
                          type: integer
                        slug:
                          type: string
                        symbol:
                          type: string
                        kind:
                          type: string
                        threshold:
                          type: number
                        value:
                          type: number
                        message:
                          type: string
                        already_true:
                          type: boolean
                        price:
                          type:
                          - number
                          - 'null'
                        url:
                          type: string
                        triggered_at:
                          type: integer
                        created_at:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                  last_id:
                    type: integer
                  count:
                    type: integer
                additionalProperties: true
                required:
                - events
                description: The alerts that fired for this agent, oldest first.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No X-API-Key of a registered agent. Register at POST /mcp/v1/register.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
  /api/v1/crypto/custom/schema:
    get:
      tags:
      - Crypto Dashboards
      summary: Crypto Custom Schema
      operationId: crypto_custom_schema_api_v1_crypto_custom_schema_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                  sections:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                  pins:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                  horizons:
                    type: array
                    items:
                      type: string
                  rules:
                    type: array
                    items:
                      type: string
                  who:
                    type: string
                  notice:
                    type: string
                additionalProperties: true
                required:
                - fields
                - sections
                - pins
                - horizons
                description: Every field, section key and pin key an agent can use.
      security: []
  /api/v1/crypto/custom:
    get:
      tags:
      - Crypto Dashboards
      summary: Crypto Custom List
      operationId: crypto_custom_list_api_v1_crypto_custom_get
      security:
      - BearerJWT: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboards:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        revision:
                          type: integer
                        updated_by:
                          type:
                          - string
                          - 'null'
                        updated_at:
                          type: number
                        url:
                          type: string
                      additionalProperties: true
                      required:
                      - slug
                      - url
                  count:
                    type: integer
                  schema:
                    type: string
                additionalProperties: true
                required:
                - dashboards
                - count
                description: The coins this user has a version of, the latest change first.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No session and no key. Sign in, or send the key of an agent linked to the user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '403':
          description: 'This agent is not linked to a registered user. Use the user''s account API key or OAuth grant, or have the user claim the agent: POST /mcp/v1/agents/{agent_id}/claim.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '503':
          description: Custom dashboards are unavailable right now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
  /api/v1/crypto/{slug}/custom:
    get:
      tags:
      - Crypto Dashboards
      summary: Crypto Custom Read
      operationId: crypto_custom_read_api_v1_crypto__slug__custom_get
      security:
      - BearerJWT: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  custom:
                    type: object
                    properties:
                      exists:
                        type: boolean
                        description: False when the user sees the standard page.
                      slug:
                        type: string
                      symbol:
                        type: string
                      url:
