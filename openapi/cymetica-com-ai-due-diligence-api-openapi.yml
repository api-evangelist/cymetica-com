        Anyone can re-verify a row: take its ``website``, run the same public

        assessment at ``/ai-due-diligence``, and compare the 0-40 total.'
      operationId: ai_crypto_leaderboard_export_api_v1_ai_due_diligence_leaderboard_export_json_get
      responses:
