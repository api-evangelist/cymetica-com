                    type: integer
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type:
                          - string
                          - 'null'
                        name:
                          type:
                          - string
                          - 'null'
                        website:
                          type:
                          - string
                          - 'null'
                        domain:
                          type:
                          - string
                          - 'null'
                        logo_url:
                          type:
                          - string
                          - 'null'
                        market_cap_rank:
                          type:
                          - integer
                          - 'null'
                        coingecko_id:
                          type:
                          - string
                          - 'null'
                        is_cymetica:
                          type: boolean
                        total_score:
