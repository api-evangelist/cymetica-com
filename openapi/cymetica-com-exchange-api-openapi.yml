components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    src__api__routes__exchange__PlaceOrderRequest:
      properties:
        side:
          type: string
          title: Side
          description: buy or sell
        order_type:
          type: string
          title: Order Type
          description: limit, market, ioc, post_only, stop_limit, stop_market
          default: limit
        price:
          type: string
          title: Price
          description: Limit price
          default: '0'
        quantity:
          type: string
          title: Quantity
          description: Base token quantity
        stop_price:
          anyOf:
          - type: string
          - type: 'null'
          title: Stop Price
          description: Stop price for stop-limit orders
        position_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Position Id
          description: Optional position UUID — used by the EVCDX-* bridge to target a specific bull position on SELL when the user has multiple open positions on the same card.  Ignored for non-EVCDX symbols.
        mode:
          type: string
          title: Mode
          description: 'Trading mode: ''live'' or ''paper''. Default ''live''. Resolution: if the account''s simulation_mode is true the server FORCES paper whatever you send; if it is false this field decides, so omitting it places a REAL order. `paper` (below) is the same control under the name every order surface shares. Read your effective mode from GET /api/v1/portfolio/summary (simulation_mode) or GET /mcp/v1/agents/me (trading_mode) before relying on a default (ET-22652).'
          default: live
        paper:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Paper
          description: 'Canonical paper/live control shared by every order surface (event-cards `paper`, bot clone `paper`). true = paper, false = live; when given it overrides `mode`. Omitted: `mode` applies (default live), and an account in simulation_mode is forced to paper regardless.'
        stp_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Stp Mode
          description: 'STP mode: cancel_resting, cancel_incoming, cancel_both, cancel_taker, decrement_and_cancel'
        time_in_force_ms:
          anyOf:
          - type: integer
            maximum: 2592000000.0
            minimum: 1000.0
          - type: 'null'
          title: Time In Force Ms
          description: 'GTT: order auto-expires after this many ms (1s to 30d)'
        expire_at:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expire At
          description: 'GTT: absolute expiry as epoch microseconds (must be in the future)'
        display_qty:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Qty
          description: 'Iceberg: visible quantity per tranche (remainder hidden)'
        route_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Route Mode
          description: 'Execution venue: ''auto'' (default — CLOB, then the displayed DEX levels for anything marketable), ''cex'' (explicit opt-out: CLOB only), ''dex'' (AMM only)'
          default: auto
        dex_ack:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Dex Ack
          description: On-chain swap acknowledgement. An order that would execute through an on-chain swap from your own wallet (a market order whose reference is the on-chain quote, ANY limit on a DEX-backed market — it executes as a swap the moment the on-chain price reaches it — or route_mode=dex) is refused with HTTP 428 DEX_SWAP_CONFIRMATION_REQUIRED carrying the swap's price_now / worst_price / chain / venue until it is resent with dex_ack=true. Without it the order only ever trades against orders resting on this book (a market remainder is cancelled, a limit rests).
          default: false
        dex_ack_price:
          anyOf:
          - type: string
          - type: 'null'
          title: Dex Ack Price
          description: The price_now you confirmed (from the 428 detail). If the on-chain price has moved more than 1% against you by the time the order arrives it is refused again with DEX_SWAP_PRICE_MOVED and the new price.
        dex_fee_ack_usd:
          anyOf:
          - type: string
          - type: 'null'
          title: Dex Fee Ack Usd
          description: The most network (gas) fee in USD you approve for the swap — send fee.max_network_fee_usd from the 428 detail. A DEX match settles on-chain and needs time to settle; it is never sent without this approval, and a resting remainder is never swapped while the current network fee is above it (DEX_SWAP_FEE_APPROVAL_REQUIRED).
      type: object
      required:
      - side
      - quantity
      title: PlaceOrderRequest
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Account session JWT (from /auth/login). Key-management routes accept only this — never an API key.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://cymetica.com/oauth/authorize
          tokenUrl: https://cymetica.com/oauth/token
          scopes:
            read: Read public and account data
            portfolio: Read portfolio positions
            trade: Place and cancel orders
