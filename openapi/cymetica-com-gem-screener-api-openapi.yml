openapi: 3.2.0
info:
  title: EventTrader Public Gem Screener API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Gem Screener
paths:
  /api/v1/gem-screener:
    get:
      tags:
      - Gem Screener
      summary: Gem Screener Snapshot
      description: 'The published snapshot: apps, chains, themes, sectors, degen shortlist, backtest summary.'
      operationId: gem_screener_snapshot_api_v1_gem_screener_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: integer
                    description: Epoch seconds.
                  generated_at_iso:
                    type: string
                  collection_floor_usd_30d:
                    type: number
                  windows: {}
                  bench:
                    type: object
                    properties:
                      label:
                        type: string
                      mult:
                        type:
                        - number
                        - 'null'
                      basis:
                        type: string
                      as_of:
                        type:
                        - integer
                        - 'null'
                        description: 'Epoch seconds: market cap read at this collection.'
                      revenue_as_of:
                        type:
                        - integer
                        - 'null'
                        description: Epoch seconds of the last day in the benchmark's revenue series.
                    additionalProperties: true
                    description: The apps' yardstick (Hyperliquid's market cap / revenue run-rate).
                  bench_chains:
                    type: object
                    properties:
                      as_of:
                        type:
                        - integer
                        - 'null'
                        description: Epoch seconds of the activity data.
                      basis:
                        type: string
                      measure:
                        type: string
                      adoption_version:
                        type: string
                      rule:
                        type: string
                      kind:
                        type: string
                      label:
                        type: string
                      mult:
                        type:
                        - number
                        - 'null'
                        description: 'The benchmark multiple: the median of the members'' multiples.'
                      mult_of:
                        type: string
                        description: 'members: what `mult` is the median of.'
                      median_mult:
                        type:
                        - number
                        - 'null'
                        description: Median multiple of every priced chain; it prices nothing.
                      median_mult_of:
                        type: string
                        description: 'all_priced_chains: what `median_mult` is the median of.'
                      member_mults:
                        type: object
                        properties:
                          min:
                            type:
                            - number
                            - 'null'
                          q1:
                            type:
                            - number
                            - 'null'
                          median:
                            type:
                            - number
                            - 'null'
                          q3:
                            type:
                            - number
                            - 'null'
                          max:
                            type:
                            - number
                            - 'null'
                        additionalProperties: true
                        description: Spread of the members' multiples.
                      n_priced:
                        type: integer
                      n_members:
                        type: integer
                      members:
                        type: array
                        items:
                          type: string
                      candidates:
                        type: array
                        items:
                          type: string
                      not_eligible:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            reason:
                              type: string
                            threshold:
                              type:
                              - number
                              - 'null'
                          additionalProperties: true
                      hold_rule:
                        type: object
                        properties: {}
                        additionalProperties: true
                      min_mcap:
                        type: number
                      min_days:
                        type: integer
                      max_lag_days:
                        type: integer
                      max_held_back:
                        type: number
                      source:
                        type: string
                      note:
                        type: object
                        properties: {}
                        additionalProperties: true
                    additionalProperties: true
                    description: 'The chains'' yardstick: the median price tag of the large chains.'
                  chart_meta:
                    type:
                    - object
                    - 'null'
                    additionalProperties: true
                    properties:
                      candle_source:
                        type: string
                        description: Candles the Screener's chart scores are computed on (DEX pool candles by contract address).
                      study_candle_source:
                        type: string
                        description: Candles the Chart Analyzer's study and held-out test were measured on (exchange candles).
                      validation_note:
                        type: string
                  degen:
                    type: object
                    properties:
                      shortlist:
                        type: array
                        items:
                          type: string
                          description: App row key (apps[].key).
                    additionalProperties: true
                  picks_ledger:
                    type:
                    - object
                    - 'null'
                    properties:
                      since:
                        type:
                        - integer
                        - 'null'
                        description: Epoch seconds of the first recorded ledger line.
                      n_lines:
                        type: integer
                        description: Selections recorded so far (one line per refresh whose shortlist changed or is 20 h old).
                      n_scored_lines:
                        type: integer
                        description: Lines with at least one pick that can be scored today.
                      btc_now:
                        type:
                        - number
                        - 'null'
                        description: BTC price (USD) used as today's reference.
                      ready:
                        type: boolean
                        description: 'True once ready_days have passed since `since`: the waiting period for the first evaluation. False does NOT mean nothing was recorded.'
                      ready_days:
                        type: integer
                        description: Days of record before the first evaluation (28).
                      ready_at:
                        type:
                        - integer
                        - 'null'
                        description: Epoch seconds when `ready` turns true (since + ready_days).
                      note:
                        type: string
                        description: One sentence explaining n, n_picks and ready.
                      cohorts:
                        type: array
                        items:
                          type: object
                          properties:
                            ts:
                              type: integer
                              description: Epoch seconds the selection was recorded.
                            n_picks:
                              type: integer
                              description: Picks recorded on that line, with their prices.
                            n:
                              type: integer
                              description: Picks that can be scored against BTC today (n <= n_picks).
                            unscored_reason:
                              type: string
                              description: 'Present when n < n_picks: no_btc_reference (no BTC price for that line, recorded or backfilled), no_btc_now, no_entry_price.'
                            btc_source:
                              type:
                              - string
                              - 'null'
                              description: recorded (BTC price written with the line) or backfilled (DeFiLlama historical price at ts); null when neither.
                            median_vs_btc:
                              type:
                              - number
                              - 'null'
                              description: Median of (p_now/p_then)/(btc_now/btc_then) - 1 over the scored picks; a pick with no price today counts as -1.
                            best:
                              type:
                              - number
                              - 'null'
                            worst:
                              type:
                              - number
                              - 'null'
                            gates_version:
                              type:
                              - string
                              - 'null'
                              description: Hash of the selection rules that produced the line.
                          additionalProperties: true
                    additionalProperties: true
                    description: 'Forward test of the Degen shortlist: every refresh appends the picks with their prices to an append-only ledger; the last 12 selections are scored against BTC from today''s prices.'
                  backtest_summary: {}
                  risk_rules:
                    type: object
                    properties: {}
                    additionalProperties: true
                  apps:
                    type: array
                    items:
                      type: object
                      properties:
                        dilution:
                          anyOf:
                          - type: object
                            properties:
                              week_pct:
                                type:
                                - number
                                - 'null'
                                description: New tokens as a percent of market cap per week, gross (no revenue subtracted); null = unknown.
                              level:
                                type: string
                                description: 'ok | caution | red | unknown, against the benchmark app (red also above 1 % a week: gate 7).'
                              basis:
                                type:
                                - string
                                - 'null'
                                description: 'emissions | unlocks: the larger of the last 30 days'' emissions and the next 30 days'' unlocks, at today''s price.'
                              usd30:
                                type:
                                - number
                                - 'null'
                              emissions_usd30:
                                type:
                                - number
                                - 'null'
                              unlocks_usd30:
                                type:
                                - number
                                - 'null'
                              over_bench_pts:
                                type:
                                - number
                                - 'null'
                                description: Points a week over the benchmark app.
                            additionalProperties: true
                            description: Apps only. The one dilution figure the picks gate uses.
                          - type: 'null'
                        supply:
                          anyOf:
                          - type: object
                            properties:
                              mcap:
                                type:
                                - number
                                - 'null'
                              fdv:
                                type:
                                - number
                                - 'null'
                              out_pct:
                                type:
                                - number
                                - 'null'
                                description: Share of tokens out, percent.
                              circ:
                                type:
                                - number
                                - 'null'
                                description: Circulating supply the page uses.
                              circ_source:
                                type:
                                - string
                                - 'null'
                                description: coingecko | market_cap/price.
                              unlocked_defillama:
                                type:
                                - number
                                - 'null'
                              sources_ratio:
                                type:
                                - number
                                - 'null'
                              sources_disagree:
                                type: boolean
                                description: The two supply sources differ by more than 2x.
                            additionalProperties: true
                            description: 'Apps only: market cap, FDV and the supply behind Upside and Dilution.'
                          - type: 'null'
                        next_unlock:
                          anyOf:
                          - type: object
                            properties:
                              kind:
                                type: string
                                description: 'event | stream | none | unknown (coin record only: no schedule on file).'
                              note:
                                type:
                                - string
                                - 'null'
                              as_of:
                                type:
                                - number
                                - 'null'
                              stale:
                                type: boolean
                              total90_tokens:
                                type:
                                - number
                                - 'null'
                              total90_pct:
                                type:
                                - number
                                - 'null'
                              total90_usd:
                                type:
                                - number
                                - 'null'
                              insider90_share:
                                type:
                                - number
                                - 'null'
                              ts:
                                type:
                                - number
                                - 'null'
                              days:
                                type:
                                - number
                                - 'null'
                              tokens:
                                type:
                                - number
                                - 'null'
                              pct_of_circ:
                                type:
                                - number
                                - 'null'
                              usd:
                                type:
                                - number
                                - 'null'
                              category:
                                type:
                                - string
                                - 'null'
                              insider_share:
                                type:
                                - number
                                - 'null'
                              window_days:
                                type: integer
                              tokens_week:
                                type:
                                - number
                                - 'null'
                              week_pct:
                                type:
                                - number
                                - 'null'
                              usd_week:
                                type:
                                - number
                                - 'null'
                            additionalProperties: true
                            description: 'Apps only. kind event: the nearest unlock (ts, days, tokens, pct_of_circ, usd, category, insider_share); stream: a weekly rate (window_days, tokens_week, week_pct, usd_week); none: the schedule shows nothing in 90 days. In the snapshot null = no schedule on file (the row''s unlock_status says unknown); the coin record says kind unknown.'
                          - type: 'null'
                      additionalProperties: true
                      description: One app row (many more fields; only these blocks are typed here). Chain rows carry no dilution, supply or next_unlock.
                  chains:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                  sectors:
                    type: object
                    properties:
                      apps: {}
                      chains: {}
                    additionalProperties: true
                  themes:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        blurb:
                          type: string
                        kind:
                          type: string
                          description: apps | chains.
                        status:
                          type: string
                          description: 'ok, or few_members (too few priced coins: the measured fields are then absent or null).'
                        basket_source:
                          type: string
                        basket_age_days:
                          type:
                          - number
                          - 'null'
                        dropped:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              sym:
                                type: string
                              reason:
                                type: string
                                description: Drop-reason code.
                            additionalProperties: true
                          description: Coins left out of the basket, each with its reason code.
                        n:
                          type: integer
                          description: Members in the basket.
                        members:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: CoinGecko id.
                              sym:
                                type: string
                              name:
                                type: string
                              w:
                                type:
                                - number
                                - 'null'
                                description: Weight in the theme's basket (shares sum to 1).
                              mcap:
                                type:
                                - number
                                - 'null'
                                description: Market cap, USD.
                              rs1m:
                                type:
                                - number
                                - 'null'
                                description: 1-month return against BTC (0.1 = 10 % ahead).
                              rs3m:
                                type:
                                - number
                                - 'null'
                                description: 3-month return against BTC.
                              chg3m:
                                type:
                                - number
                                - 'null'
                              beta:
                                type:
                                - number
                                - 'null'
                              chg7d:
                                type:
                                - number
                                - 'null'
                              chg30d:
                                type:
                                - number
                                - 'null'
                              vol24h:
                                type:
                                - number
                                - 'null'
                              ath_chg_pct:
                                type:
                                - number
                                - 'null'
                              flag:
                                type:
                                - string
                                - 'null'
                                description: broken | not_moved | null.
                              links:
                                type: object
                                properties:
                                  coingecko:
                                    type:
                                    - string
                                    - 'null'
                                  dextools:
                                    type:
                                    - string
                                    - 'null'
                                  dextools_reason:
                                    type:
                                    - string
                                    - 'null'
                                  pair:
                                    type:
                                    - string
                                    - 'null'
                                additionalProperties: true
                            additionalProperties: true
                            required:
                            - id
                            - sym
                        stage:
                          type:
                          - string
                          - 'null'
                          enum:
                          - emerging
                          - hot
                          - fading
                          - falling
                          - null
                          description: 'Sector stage from the two returns against the median sector: hot = ahead of the median over 3 months AND 1 month; fading = ahead over 3 months only; emerging = ahead over 1 month only; falling = neither. null when the theme is not measured.'
                        stage_prev:
                          type:
                          - string
                          - 'null'
                          enum:
                          - emerging
                          - hot
                          - fading
                          - falling
                          - null
                          description: The stage 4 weeks earlier (sector_stages.back_weeks).
                        hot:
                          type: boolean
                          description: Exactly stage == hot (ahead of the median sector over 3 months and over 1 month). The older meaning, beats BTC this month and the median alt, is rs1m > 0 and beat_median_alt_1m.
                        rs1m:
                          type:
                          - number
                          - 'null'
                          description: Basket 1-month return against BTC.
                        rs3m:
                          type:
                          - number
                          - 'null'
                          description: Basket 3-month return against BTC.
                        theme_4w:
                          type:
                          - number
                          - 'null'
                          description: Basket 1-month return (4 weeks), a fraction.
                        theme_13w:
                          type:
                          - number
                          - 'null'
                          description: Basket 3-month return (13 weeks), a fraction.
                        btc_4w:
                          type:
                          - number
                          - 'null'
                        btc_13w:
                          type:
                          - number
                          - 'null'
                        theme_4w_prev:
                          type:
                          - number
                          - 'null'
                        theme_13w_prev:
                          type:
                          - number
                          - 'null'
                        vs_median_1m:
                          type:
                          - number
                          - 'null'
                          description: (1 + theme_4w) / (1 + median 1-month theme return) - 1.
                        vs_median_3m:
                          type:
                          - number
                          - 'null'
                          description: (1 + theme_13w) / (1 + median 3-month theme return) - 1.
                        vs_median_1m_prev:
                          type:
                          - number
                          - 'null'
                        vs_median_3m_prev:
                          type:
                          - number
                          - 'null'
                        alpha_1m:
                          type:
                          - number
                          - 'null'
                          description: Performance vs BTC beyond what beta explains, 1 month.
                        alpha_3m:
                          type:
                          - number
                          - 'null'
                          description: Same, 3 months.
                        beat_median_alt_1m:
                          type: boolean
                          description: The basket's 1-month return beat the median top-50 alt's.
                        rs_members_1m:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              w:
                                type: number
                                description: Weight in the return window's basket.
                            additionalProperties: true
                          description: The coins and weights the 1-month return was computed on.
                        rs_members_3m:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              w:
                                type: number
                                description: Weight in the return window's basket.
                            additionalProperties: true
                          description: The coins and weights the 3-month return was computed on.
                        breadth:
                          type:
                          - number
                          - 'null'
                          description: Percent of the 3-month return basket's members that beat BTC over 3 months.
                        beta:
                          type:
                          - number
                          - 'null'
                        beta_se:
                          type:
                          - number
                          - 'null'
                        rho:
                          type:
                          - number
                          - 'null'
                        n_weeks:
                          type: integer
                        beta_up:
                          type:
                          - number
                          - 'null'
                        gamma:
                          type:
                          - number
                          - 'null'
                        alt_sens:
                          type:
                          - number
                          - 'null'
                        alt_sens_se:
                          type:
                          - number
                          - 'null'
                        alt_sens_n:
                          type: integer
                        te_week:
                          type:
                          - number
                          - 'null'
                        resid_week:
                          type:
                          - number
                          - 'null'
                        dd_1y:
                          type:
                          - number
                          - 'null'
                        tier:
                          type:
                          - integer
                          - 'null'
                        tier_beta:
                          type:
                          - integer
                          - 'null'
                        z1:
                          type:
                          - number
                          - 'null'
                        z3:
                          type:
                          - number
                          - 'null'
                        za1:
                          type:
                          - number
                          - 'null'
                        za3:
                          type:
                          - number
                          - 'null'
                        measure:
                          type: string
                        mcap:
                          type:
                          - number
                          - 'null'
                        index:
                          type: array
                          items:
                            type: number
                          description: Weekly basket index, 100 at start.
                        top3:
                          type: array
                          items:
                            type: string
                        beta_members:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              w:
                                type: number
                              mcap:
                                type:
                                - number
                                - 'null'
                            additionalProperties: true
                        beta_basket_overlap:
                          type: integer
                        tags:
                          type: array
                          items:
                            type: string
                          description: leads | waiting | turning | falling | own_story | fund_up.
                        tags_beta:
                          type: array
                          items:
                            type: string
                          description: Tags under the older beta rule.
                        shared_with:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                              n:
                                type: integer
                            additionalProperties: true
                        fundament:
                          type: object
                          properties:
                            kind:
                              type: string
                              description: revenue | activity | stables.
                            level:
                              type:
                              - number
                              - 'null'
                            last30:
                              type:
                              - number
                              - 'null'
                            last30_end:
                              type:
                              - number
                              - 'null'
                            g3m:
                              type:
                              - number
                              - 'null'
                            g3m_reason:
                              type:
                              - string
                              - 'null'
                            g6m:
                              type:
                              - number
                              - 'null'
                            r2:
                              type:
                              - number
                              - 'null'
                            small:
                              type: boolean
                            as_of:
                              type:
                              - number
                              - 'null'
                            source:
                              type: string
                            series:
                              type: array
                              items:
                                type: array
                                items:
                                  type:
                                  - number
                                  - 'null'
                              description: '[unix seconds, value].'
                            monthly:
                              type: array
                              items:
                                type: object
                                properties:
                                  m:
                                    type: string
                                  v:
                                    type:
                                    - number
                                    - 'null'
                                  days:
                                    type: integer
                                  partial:
                                    type: boolean
                                additionalProperties: true
                          additionalProperties: true
                          description: What the theme's apps earn (revenue) or its chains' users paid (activity); other keys vary with kind.
                        attention:
                          type: object
                          properties:
                            status:
                              type: string
                              description: ok | not_enough_data | not_available.
                            reason:
                              type:
                              - string
                              - 'null'
                            people:
                              type:
                              - number
                              - 'null'
                            messages:
                              type:
                              - number
                              - 'null'
                            total_people:
                              type:
                              - number
                              - 'null'
                            share_pct:
                              type:
                              - number
                              - 'null'
                            change_pp:
                              type:
                              - number
                              - 'null'
                            prev_people:
                              type:
                              - number
                              - 'null'
                            prev_total_people:
                              type:
                              - number
                              - 'null'
                            prev_share_pct:
                              type:
                              - number
                              - 'null'
                            top_coins:
                              type: array
                              items:
                                type: object
                                properties: {}
                                additionalProperties: true
                            first_day:
                              type:
                              - string
                              - 'null'
                            last_day:
                              type:
                              - string
                              - 'null'
                            as_of:
                              type:
                              - number
                              - 'null'
                            source:
                              type: string
                          additionalProperties: true
                          description: 'Belief Networks: share of people talking about the theme over 7 days.'
                      additionalProperties: true
                      required:
                      - key
                      - name
                      - kind
                      - status
                      description: One sector. A theme that is not status ok carries only its identity and basket facts.
                  altseason:
                    type: object
                    properties:
                      index:
                        type:
                        - number
                        - 'null'
                      history:
                        type: array
                        items:
                          type: array
                          items:
                            type:
                            - number
                            - 'null'
                        description: '[epoch seconds, index, alts ranked].'
                      n:
                        type: integer
                        description: Alts ranked (top 50).
                      three_months_ago:
                        type:
                        - number
                        - 'null'
                      universe:
                        type: array
                        items:
                          type: string
                      alt50:
                        type: array
                        items:
                          type: string
                      universe_mcap:
                        type: object
                        properties: {}
                        additionalProperties:
                          type:
                          - number
                          - 'null'
                      currency_unit:
                        type: object
                        properties:
                          rule:
                            type: object
                            properties: {}
                            additionalProperties: true
                          removed:
                            type: array
                            items:
                              type: object
                              properties: {}
                              additionalProperties: true
                        additionalProperties: true
                      alt_4w_median:
                        type:
