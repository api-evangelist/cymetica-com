  /api/v1/gem-screener/coins/{symbol}/degen-report:
    get:
      tags:
      - Gem Screener
      summary: Degen report for one coin (<= 150 words)
      description: 'What it is / Money / Real or printed / Numbers / Good / Shady / The bet / Verdict, built only

        from the snapshot''s facts (unknown says ''unknown''), sources linked, ''Not financial advice'' at the

        end. `nexus_prompt` asks NEXUS for the same report in the same format.'
      operationId: gem_screener_degen_report_api_v1_gem_screener_coins__symbol__degen_report_get
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 80
          description: The coin's slug (e.g. pharaoh-exchange, from any list's `slug`) or its ticker, case-insensitive (e.g. PHAR). A shared ticker goes to the largest market cap; the slug never confuses two coins. Apps are searched before chains.
          title: Symbol
        description: The coin's slug (e.g. pharaoh-exchange, from any list's `slug`) or its ticker, case-insensitive (e.g. PHAR). A shared ticker goes to the largest market cap; the slug never confuses two coins. Apps are searched before chains.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DegenReportResponse'
        '404':
          description: No coin with that symbol in the snapshot.
        '503':
          description: 'The first snapshot is still being collected (status: warming).'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
    post:
      tags:
      - Gem Screener
      summary: Ask for the Degen report of one app, or for a refresh (Pro plan or higher)
      description: 'Makes the report when the app has none, and makes it again when it is outdated or 7 days

        old. Before that it answers with the cached report (`generated` false). The research reads

        DefiLlama''s audit and hacks lists; every filled check links its source. ASKING needs a NEXUS

        Pro plan or higher (ET-28606 item 16): the account comes from X-API-Key, a Bearer token or the

        session cookie; 401 without one, 402 on the Free plan, 503 when the plan cannot be checked.

        READING a finished report (GET) stays free. 6 requests per hour per address.'
      operationId: gem_screener_degen_report_ask_api_v1_gem_screener_coins__symbol__degen_report_post
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 80
          description: The coin's slug (e.g. pharaoh-exchange, from any list's `slug`) or its ticker, case-insensitive (e.g. PHAR). A shared ticker goes to the largest market cap; the slug never confuses two coins. Apps are searched before chains.
          title: Symbol
        description: The coin's slug (e.g. pharaoh-exchange, from any list's `slug`) or its ticker, case-insensitive (e.g. PHAR). A shared ticker goes to the largest market cap; the slug never confuses two coins. Apps are searched before chains.
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DegenReportResponse'
        '401':
          description: 'No account: send X-API-Key, a Bearer token or a session.'
        '402':
          description: Asking needs a NEXUS Pro plan or higher (PAID_PLAN_REQUIRED).
        '404':
          description: No app with that symbol in the snapshot.
        '503':
          description: 'The report cannot be made right now: not available.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/gem-screener/report-access:
    get:
      tags:
      - Gem Screener
      summary: Gem Screener Report Access
      description: 'May THIS caller ask for a Degen report (ET-28821 item 18)? The same gate the POST runs

        (`require_paid_plan`), answered without asking: the page reads it once to draw the Pro badge

        and "See the plans" for the viewer in front of it. It says nothing about any other account

        and carries no plan name, no user id and no account detail: only `can_ask` and a `reason`

        (`ok`, `sign_in`, `plan`, or `unknown` when the plan cannot be checked; `can_ask` is then

        null and the page shows nothing it does not know). Never cached.'
      operationId: gem_screener_report_access_api_v1_gem_screener_report_access_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  can_ask:
                    type:
                    - boolean
                    - 'null'
                    description: May THIS caller ask for a Degen report? null when the plan cannot be checked.
                  reason:
                    type: string
                    enum:
                    - ok
                    - sign_in
                    - plan
                    - unknown
                additionalProperties: false
                required:
                - can_ask
                - reason
                description: 'The same gate POST .../degen-report runs, answered without asking. Says nothing about any other account; no plan name, user id or account detail. Never cached (Cache-Control: no-store).'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
