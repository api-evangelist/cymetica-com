openapi: 3.2.0
info:
  title: EventTrader Public Posted Links API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: posted-links
paths:
  /api/v1/posted-links:
    get:
      tags:
      - posted-links
      summary: Posted Links Api
      description: Directory of every cymetica.com page the platform has shared on Telegram/Discord (keyless).
      operationId: posted_links_api_api_v1_posted_links_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  generated_at:
                    type: string
                  titles_pending:
                    type: integer
                    description: Links whose title is still derived from the path (title_source=path).
                  groups:
                    type: array
                    items:
                      type: string
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        url:
                          type: string
                        title:
                          type: string
                        title_source:
                          type: string
                          enum:
                          - db
                          - page
                          - path
                        group:
                          type: string
                        first_posted:
                          type:
                          - string
                          - 'null'
                        last_posted:
                          type:
                          - string
                          - 'null'
                        posts:
                          type: integer
                        channels:
                          type: array
                          items:
                            type: string
                            enum:
                            - telegram
                            - discord
                      additionalProperties: false
                      required:
                      - path
                      - url
                      - title
                      - group
                  source:
                    type: string
                additionalProperties: true
                required:
                - ok
                - count
                - links
                - groups
                description: Directory of every cymetica.com page the platform has shared on Telegram/Discord. If the directory cannot be built the route answers 503 with `{ok:false, count:0, links:[], groups:[], error}`.
      security: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Account session JWT (from /auth/login). Key-management routes accept only this — never an API key.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://cymetica.com/oauth/authorize
          tokenUrl: https://cymetica.com/oauth/token
          scopes:
            read: Read public and account data
            portfolio: Read portfolio positions
            trade: Place and cancel orders
x-provenance:
  method: harvested
  publisher: Cymetica
  source: https://cymetica.com/openapi-public.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
