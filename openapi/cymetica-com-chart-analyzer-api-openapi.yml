openapi: 3.2.0
info:
  title: EventTrader Public Chart Analyzer API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Chart Analyzer
paths:
  /api/v1/chart-analyzer/analyze:
    get:
      tags:
      - Chart Analyzer
      summary: Analyze Get
      description: 'One number from 1 (very bearish) to 100 (very bullish) for a coin''s chart, with the patterns found.

        By contract address (+ chain) or by ticker.'
      operationId: analyze_get_api_v1_chart_analyzer_analyze_get
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 24
          - type: 'null'
          description: Crypto ticker, e.g. BTC (Binance USDT pair)
          title: Symbol
        description: Crypto ticker, e.g. BTC (Binance USDT pair)
      - name: contract
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          description: Token contract address; identifies the coin exactly
          title: Contract
        description: Token contract address; identifies the coin exactly
      - name: chain
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          description: Chain of the contract, e.g. ethereum, solana, bsc (needed only when the address is ambiguous)
          title: Chain
        description: Chain of the contract, e.g. ethereum, solana, bsc (needed only when the address is ambiguous)
      - name: timeframe
        in: query
        required: false
        schema:
          type: string
          maxLength: 4
          description: 1h, 4h, 1d, 5d, 1w, 2w, 1M, or auto (the longest with enough candles)
          default: 1d
          title: Timeframe
        description: 1h, 4h, 1d, 5d, 1w, 2w, 1M, or auto (the longest with enough candles)
      - name: include_candles
        in: query
        required: false
        schema:
          type: boolean
          description: Also return the candles that were scored
          default: false
          title: Include Candles
        description: Also return the candles that were scored
      - name: closed_only
        in: query
        required: false
        schema:
          type: boolean
          description: Score closed candles only (drop a still-forming last candle), so the number is reproducible until the next close
          default: false
          title: Closed Only
        description: Score closed candles only (drop a still-forming last candle), so the number is reproducible until the next close
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
                    description: 1 (very bearish) to 100 (very bullish).
                  band:
                    type: string
                  symbol:
                    type:
                    - string
                    - 'null'
                  timeframe:
                    type:
                    - string
                    - 'null'
                  source:
                    type: string
                  candles_used:
                    type: integer
                  first_candle:
                    type: integer
                  last_candle:
                    type: integer
                  last_candle_forming:
                    type: boolean
                  forming_note:
                    type: string
                  reading:
                    type: string
                  patterns:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        direction:
                          type: string
                          enum:
                          - bullish
                          - bearish
                          - too few samples
                          description: 'Measured: bullish when its train success rate is above the base rate.'
                        textbook_direction:
                          type: string
                        success_rate:
                          type:
                          - number
                          - 'null'
                        train_samples:
                          type:
                          - integer
                          - 'null'
                        pattern_score:
                          type:
                          - integer
                          - 'null'
                        counted_in_score:
                          type: boolean
                        confirmed_at:
                          type: integer
                          description: Unix seconds of the confirming candle.
                        bars_ago:
                          type: integer
                        drawing:
                          type: array
                          items:
                            type: object
                            properties:
                              time:
                                type: integer
                                description: Unix seconds.
                              price:
                                type: number
                            additionalProperties: false
                      additionalProperties: false
                  counted_patterns:
                    type: array
                    items:
                      type: string
                  chart_rate:
                    type: number
                  base_rate:
                    type: number
                  scale:
                    type: object
                    properties: {}
                    additionalProperties: true
                  rule:
                    type: string
                  study_version:
                    type: string
                  study_url:
                    type: string
                  not_advice:
                    type: string
                  as_of:
                    type: string
                  midpoint:
                    type: string
                    description: 'What 50 means: the base rate (share of all study candles that rose).'
                  coverage:
                    type: object
                    properties:
                      covered:
                        type: boolean
                      coin:
                        type: string
                      timeframe:
                        type: string
                      note:
                        type: string
                    additionalProperties: true
                    description: Where the study does not cover this coin or timeframe (ET-28324).
                  identity:
                    type:
                    - object
                    - 'null'
                    description: 'How the coin was identified: by contract (chain, address, pool, dex, symbol, name, gem_screener) or by ticker (Binance pair).'
                  candles_fetched_at:
                    type: string
                    description: 'Contract input: when the DEX pool candles were fetched.'
                  candles_stale:
                    type: boolean
                  candles:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
                    description: '[time, open, high, low, close, volume] rows; only with include_candles or an upload.'
                  verdict:
                    type: object
                    properties:
                      label:
                        type: string
                        enum:
                        - READY TO POP
                        - READY TO DUMP
                        - NO EDGE
                      rule_label:
                        type: string
                        description: What the calibration rule alone says (before the held-out guard).
                      held_out_failed:
                        type:
                        - object
                        - 'null'
                      probability:
                        type:
                        - number
                        - 'null'
                        description: Calibrated, of the labelled side; null for NO EDGE.
                      range:
                        type:
                        - array
                        - 'null'
                        items:
                          type: number
                        minItems: 2
                        maxItems: 2
                        description: '[lo, hi], a 95% Wilson range.'
                      cases:
                        type:
                        - integer
                        - 'null'
                      pooled_cases:
                        type:
                        - integer
                        - 'null'
                      base_rate:
                        type:
                        - number
                        - 'null'
                      gap:
                        type:
                        - number
                        - 'null'
                      up:
                        type:
                        - object
                        - 'null'
                        additionalProperties: true
                        properties:
                          raw:
                            type: number
                          calibrated:
                            type:
                            - number
                            - 'null'
                            description: The share of the pooled calibration cases that went this way (made monotone); the number shown.
                          range:
                            type:
                            - array
                            - 'null'
                            items:
                              type: number
                            minItems: 2
                            maxItems: 2
                            description: 'The 95% range of `calibrated`, over the pooled cases: `calibrated` always lies inside it (ET-29276).'
                          cases:
                            type: integer
                          pooled_cases:
                            type:
                            - integer
                            - 'null'
                          rate:
                            type:
                            - number
                            - 'null'
                            description: The bin's own rate.
                          bin_range:
                            type:
                            - array
                            - 'null'
                            items:
                              type: number
                            minItems: 2
                            maxItems: 2
                            description: The 95% range of the bin's own rate.
                          base_rate:
                            type: number
                          usable:
                            type: boolean
                          bin:
                            type: integer
                        description: 'One side''s figures: the raw model number, its calibration bin, the calibrated value and ranges.'
                      down:
                        type:
                        - object
                        - 'null'
                        additionalProperties: true
                        properties:
                          raw:
                            type: number
                          calibrated:
                            type:
                            - number
                            - 'null'
                            description: The share of the pooled calibration cases that went this way (made monotone); the number shown.
                          range:
                            type:
                            - array
                            - 'null'
                            items:
                              type: number
                            minItems: 2
                            maxItems: 2
                            description: 'The 95% range of `calibrated`, over the pooled cases: `calibrated` always lies inside it (ET-29276).'
                          cases:
                            type: integer
                          pooled_cases:
                            type:
                            - integer
                            - 'null'
                          rate:
                            type:
                            - number
                            - 'null'
                            description: The bin's own rate.
                          bin_range:
                            type:
                            - array
                            - 'null'
                            items:
                              type: number
                            minItems: 2
                            maxItems: 2
                            description: The 95% range of the bin's own rate.
                          base_rate:
                            type: number
                          usable:
                            type: boolean
                          bin:
                            type: integer
                        description: 'One side''s figures: the raw model number, its calibration bin, the calibrated value and ranges.'
                      drivers:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            weight_up:
                              type: number
                            weight_down:
                              type: number
                          additionalProperties: false
                      why:
                        type: string
                      timeframe:
                        type: string
                      target:
                        type: object
                        properties:
                          up_pct:
                            type: number
                          down_pct:
                            type: number
                          window:
                            type: integer
                          text:
                            type: string
                        additionalProperties: false
                      rule:
                        type: string
                      held_out_record:
                        type:
                        - object
                        - 'null'
                      coverage:
                        type: string
                        enum:
                        - covered
                        - pair_not_in_study
                        - asset_not_covered
                        - timeframe_not_covered
                      coverage_note:
                        type: string
                      withheld:
                        type:
                        - object
                        - 'null'
                        additionalProperties: true
                        properties:
                          label:
                            type:
                            - string
                            - 'null'
                          probability:
                            type:
                            - number
                            - 'null'
                          range:
                            type:
                            - array
                            - 'null'
                            items:
                              type: number
                            minItems: 2
                            maxItems: 2
                            description: '[lo, hi], a 95% Wilson range.'
                          cases:
                            type:
                            - integer
                            - 'null'
                          reason:
                            type: string
                        description: 'Null for an exchange chart. For a DEX-pool coin or uploaded candles (which get no verdict): what the table alone would have said, and why the label is withheld.'
                    additionalProperties: false
                    required:
                    - label
                    - probability
                    - range
                    - cases
                    - base_rate
                    - why
                    - timeframe
                    - target
                    - rule
                    - coverage
                    description: READY TO POP / READY TO DUMP / NO EDGE with the calibrated probability, its 95% range, the base rate, the cases and why.
                  setups:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        group:
                          type: string
                          enum:
                          - pattern
                          - structure
                          - indicator
                        kind:
                          type: string
                        textbook_side:
                          type: string
                        train:
                          type:
                          - object
                          - 'null'
                        test:
                          type:
                          - object
                          - 'null'
                        included:
                          type: boolean
                        weight_up:
                          type:
                          - number
                          - 'null'
                        weight_down:
                          type:
                          - number
                          - 'null'
                        measured_side:
                          type:
                          - string
                          - 'null'
                      additionalProperties: false
                    description: The structure, pattern and indicator states active on the last candle, each with its train / held-out rates and model weight.
                  structures:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        status:
                          type: string
                        price:
                          type: number
                        slope_pct_per_bar:
                          type: number
                        long_term:
                          type: boolean
                        log_scale:
                          type: boolean
                        pair:
                          type: string
                        touches:
                          type: array
                          items:
                            type: object
                            properties:
                              time:
                                type: integer
                                description: Unix seconds.
                              price:
                                type: number
                            additionalProperties: false
                        from:
                          type: object
                          properties:
                            time:
                              type: integer
                              description: Unix seconds.
                            price:
                              type: number
                          additionalProperties: false
                        to:
                          type: object
                          properties:
                            time:
                              type: integer
                              description: Unix seconds.
                            price:
                              type: number
                          additionalProperties: false
                        path:
                          type: array
                          items:
                            type: array
                            items:
                              type: number
                        broken_at:
                          type:
                          - integer
                          - 'null'
                        at:
                          type: integer
                        upper:
                          type: object
                        lower:
                          type: object
                      additionalProperties: true
                      description: A drawing; which keys appear depends on kind.
                    description: Support, resistance, trendlines (log scale), channels, wedges, triangles, flags, head and shoulders, double tops / bottoms, drawn by rule with touch points.
                  swings:
                    type: object
                    properties:
                      highs:
                        type: array
                        items:
                          type: object
                          properties:
                            time:
                              type: integer
                              description: Unix seconds.
                            price:
                              type: number
                          additionalProperties: false
                      lows:
                        type: array
                        items:
                          type: object
                          properties:
                            time:
                              type: integer
                              description: Unix seconds.
                            price:
                              type: number
                          additionalProperties: false
                    additionalProperties: false
                    description: The confirmed swing highs and lows (last 40 each).
                  indicators:
                    type: object
                    properties:
                      from_time:
                        type: integer
                      rsi:
                        type: array
                        items:
                          type:
                          - number
                          - 'null'
                      macd:
                        type: array
                        items:
                          type:
                          - number
                          - 'null'
                      macd_signal:
                        type: array
                        items:
                          type:
                          - number
                          - 'null'
                      macd_hist:
                        type: array
                        items:
                          type:
                          - number
                          - 'null'
                      sma50:
                        type: array
                        items:
                          type:
                          - number
                          - 'null'
                      sma200:
                        type: array
                        items:
                          type:
                          - number
                          - 'null'
                      bb_upper:
                        type: array
                        items:
                          type:
                          - number
                          - 'null'
                      bb_lower:
                        type: array
                        items:
                          type:
                          - number
                          - 'null'
                      last:
                        type: object
                        properties: {}
                        additionalProperties:
                          type:
                          - number
                          - 'null'
                    additionalProperties: true
                    description: Indicator series aligned to the last candles (from from_time) and their last values.
                  weekly_signal:
                    type: object
                    properties:
                      available:
                        type: boolean
                      fires:
                        type:
                        - boolean
                        - 'null'
                      rsi:
                        type:
                        - number
                        - 'null'
                      macd_hist_rising:
                        type:
                        - boolean
                        - 'null'
                      weeks_read:
                        type:
                        - integer
                        - 'null'
                      week_end:
                        type:
                        - integer
                        - 'null'
                      rule:
                        type: string
                      record:
                        type: object
                        properties: {}
                        additionalProperties: true
                      on_this_chart:
                        type:
                        - object
                        - 'null'
                      page:
                        type: string
                      note:
                        type:
                        - string
                        - 'null'
                      marks:
                        type: array
                        items:
                          type: integer
                    additionalProperties: true
                    description: The /weekly-signal indicator read from this chart's weekly closes.
                  expert_study_url:
                    type: string
                  calls_url:
                    type: string
                    description: The public ledger of the page's own calls.
                  projections:
                    type: object
                    properties:
                      timeframe:
                        type: string
                      window_candles:
                        type: integer
                      horizon_seconds:
                        type: integer
                      from:
                        type: object
                        properties:
                          time:
                            type: integer
                            description: Unix seconds.
                          price:
                            type: number
                        additionalProperties: false
                      to_time:
                        type: integer
                        description: Unix seconds, end of the projection window.
                      scenarios:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              enum:
                              - bullish
                              - bearish
                              - sideways
                            label:
                              type: string
                            direction:
                              type: string
                              enum:
                              - up
                              - down
                              - flat
                            probability:
                              type: number
                              description: Calibrated P(first barrier) from the expert study; sideways is the remainder.
                            range:
                              type:
                              - array
                              - 'null'
                              items:
                                type: number
                              minItems: 2
                              maxItems: 2
                              description: '[lo, hi], a 95% Wilson range.'
                            cases:
                              type:
                              - integer
                              - 'null'
                            base_rate:
                              type:
                              - number
                              - 'null'
                            usable:
                              type: boolean
                            residual:
                              type: boolean
                              description: True on the sideways scenario (1 - up - down).
                            target_price:
                              type: number
                            path:
                              type: array
                              items:
                                type: object
                                properties:
                                  time:
                                    type: integer
                                    description: Unix seconds.
                                  price:
                                    type: number
                                additionalProperties: false
                            rank:
                              type: integer
                          additionalProperties: false
                        description: Ranked by probability; empty when no probability is claimed.
                      main:
                        type:
                        - string
                        - 'null'
                        description: id of the most probable scenario, null when none is claimed.
                      basis:
                        type: string
                      tracked_record:
                        type: object
                        properties:
                          held_out:
                            type:
                            - object
                            - 'null'
                          live_calls_url:
                            type: string
                        additionalProperties: true
                      not_advice:
                        type: string
                      reason:
                        type: string
                        description: Present when no scenario is drawn (withheld verdict, no study block).
                      sum_check:
                        type: number
                      drivers:
                        type: array
                        items: {}
                    additionalProperties: false
                    description: Ranked projection scenarios for the chart's timeframe from the verdict's measured probabilities, drawn as dashed paths on the page.
                additionalProperties: false
                required:
                - score
                - band
                - patterns
                - candles_used
                - as_of
                description: 'One number for the chart, the patterns found (drawn), and how the number was made; plus the verdict layer: verdict, setups, structures, swings, indicators and the Weekly Signal.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: 'Bad input (`error.code`: INVALID_SYMBOL, INVALID_TIMEFRAME, MISSING_INPUT, BAD_JSON, BAD_ROW, BAD_VALUE, BAD_TIME, MISSING_COLUMNS, DUPLICATE_TIME, TOO_FEW_ROWS, TOO_MANY_ROWS, NOT_TEXT, EMPTY_FILE, INVALID_CONTRACT, UNKNOWN_CHAIN, UNSUPPORTED_CHAIN, CHAIN_NEEDED, TOKEN_MISMATCH).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '404':
          description: 'UNKNOWN_SYMBOL, TOO_LITTLE_HISTORY or NO_CANDLES (no DEX pool / no candle data for the contract: no score is given).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '503':
          description: 'UPSTREAM_UNAVAILABLE, or COLLECTING: the contract''s candles are being fetched; ask again in a few minutes.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security: []
    post:
      tags:
      - Chart Analyzer
      summary: Analyze Post
      description: 'Same as GET ({"contract","chain"} or {"symbol"}), or score candles you send: {"candles": [...]}.'
      operationId: analyze_post_api_v1_chart_analyzer_analyze_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
                    description: 1 (very bearish) to 100 (very bullish).
                  band:
                    type: string
                  symbol:
                    type:
                    - string
                    - 'null'
                  timeframe:
                    type:
                    - string
                    - 'null'
                  source:
                    type: string
                  candles_used:
                    type: integer
                  first_candle:
                    type: integer
                  last_candle:
                    type: integer
                  last_candle_forming:
                    type: boolean
                  forming_note:
                    type: string
                  reading:
                    type: string
                  patterns:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        direction:
                          type: string
                          enum:
                          - bullish
                          - bearish
                          - too few samples
                          description: 'Measured: bullish when its train success rate is above the base rate.'
                        textbook_direction:
                          type: string
                        success_rate:
                          type:
                          - number
                          - 'null'
                        train_samples:
                          type:
                          - integer
                          - 'null'
                        pattern_score:
                          type:
                          - integer
                          - 'null'
                        counted_in_score:
                          type: boolean
                        confirmed_at:
                          type: integer
                          description: Unix seconds of the confirming candle.
                        bars_ago:
                          type: integer
                        drawing:
                          type: array
                          items:
                            type: object
                            properties:
                              time:
                                type: integer
                                description: Unix seconds.
                              price:
                                type: number
                            additionalProperties: false
                      additionalProperties: false
                  counted_patterns:
