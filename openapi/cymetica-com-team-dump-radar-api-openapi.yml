openapi: 3.2.0
info:
  title: EventTrader Public Team Dump Radar API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Team Dump Radar
paths:
  /api/v1/team-dump-radar:
    get:
      tags:
      - Team Dump Radar
      summary: Team Dump Radar Snapshot
      operationId: team_dump_radar_snapshot_api_v1_team_dump_radar_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: integer
                    description: Epoch seconds.
                  universe_source:
                    type:
                    - string
                    - 'null'
                  universe_fetched_at:
                    type:
                    - number
                    - 'null'
                  window_days:
                    type: integer
                  counts:
                    type: object
                    properties:
                      coins:
                        type: integer
                      with_team:
                        type: integer
                      verified:
                        type: integer
                      grey:
                        type: integer
                      red:
                        type: integer
                      yellow:
                        type: integer
                      green:
                        type: integer
                      ethereum:
                        type: integer
                      reasons:
                        type: object
                        properties: {}
                        additionalProperties: true
                        description: 'Grey coins by reason: native_coin, not_supported_chain, no_team, stable_or_wrapped'
                      by_chain:
                        type: object
                        properties: {}
                        additionalProperties: true
                    additionalProperties: true
                  chains:
                    type: array
                    items:
                      type: string
                  coins:
                    type: array
                    items:
                      type: object
                      properties:
                        s:
                          type: string
                        n:
                          type:
                          - string
                          - 'null'
                        r:
                          type:
                          - integer
                          - 'null'
                        l:
                          type: string
                          enum:
                          - red
                          - yellow
                          - green
                          - grey
                        f:
                          type: string
                        t:
                          type: boolean
                        x:
                          type: integer
                        why:
                          type:
                          - string
                          - 'null'
                        lg:
                          type:
                          - integer
                          - 'null'
                        ck:
                          type: boolean
                        ch:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                      description: s=ticker, n=name, r=rank, l=light, f=first fact, p=progress to green (0-1), x=red incidents, t=has evidenced team wallets, lg=logo id (/api/v1/team-dump-radar/logo/{lg}.png), ck=one-time check offered, ch=chain read
                  does_not:
                    type: array
                    items:
                      type: string
                  changes:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                additionalProperties: true
                required:
                - generated_at
                - coins
                - counts
                description: Every coin's light (top 500 by market cap + COTI). Grey = no evidenced team wallet.
        '503':
          description: The first snapshot is still being collected; retry shortly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security: []
  /api/v1/team-dump-radar/status:
    get:
      tags:
      - Team Dump Radar
      summary: Team Dump Radar Status
      operationId: team_dump_radar_status_api_v1_team_dump_radar_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type:
                    - number
                    - 'null'
                  age_seconds:
                    type:
                    - number
                    - 'null'
                  refresh_every_seconds:
                    type: integer
                  universe_every_seconds:
                    type: integer
                  universe_fetched_at:
                    type:
                    - number
                    - 'null'
                  universe_source:
                    type:
                    - string
                    - 'null'
                  refreshing:
                    type: boolean
                  counts:
                    anyOf:
                    - type: object
                      properties: {}
                      additionalProperties: true
                    - type: 'null'
                  last_attempt:
                    anyOf:
                    - type: object
                      properties: {}
                      additionalProperties: true
                    - type: 'null'
                  does_not:
                    type: array
                    items:
                      type: string
                    description: What Team Dump Radar does not do.
                additionalProperties: false
                required:
                - refresh_every_seconds
                - refreshing
                - does_not
                description: Collection times, counts and what it does not do.
      security: []
  /api/v1/team-dump-radar/coins/{symbol}:
    get:
      tags:
      - Team Dump Radar
      summary: Team Dump Radar Coin
      operationId: team_dump_radar_coin_api_v1_team_dump_radar_coins__symbol__get
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  name:
                    type:
                    - string
                    - 'null'
                  light:
                    type: string
                    enum:
                    - red
                    - yellow
                    - green
                    - grey
                  confidence:
                    type:
                    - string
                    - 'null'
                  low_confidence:
                    type:
                    - boolean
                    - 'null'
                  facts:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                        proof:
                          type: array
                          items:
                            type: object
                            properties:
                              tx:
                                type: string
                              url:
                                type: string
                            additionalProperties: true
                      additionalProperties: true
                  progress:
                    type:
                    - number
                    - 'null'
                  quiet_days:
                    type:
                    - number
                    - 'null'
                  offences:
                    type: integer
                  incidents:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                  proof:
                    anyOf:
                    - type: object
                      properties: {}
                      additionalProperties: true
                      description: team_wallets (with evidence), exchange_addresses (with label source), sends/returns/burns/mints/locks (Etherscan links), totals (untagged_pct = the share the card shows), not_counted
                    - type: 'null'
                  chains:
                    type: array
                    items:
                      type: object
                      properties:
                        chain:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                          - scanned
                          - not_scanned
                          - no_contract
                          - no_team_wallet
                        reason:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                      description: 'Per-chain scan status: a chain whose reads failed is not_scanned, never zero flow'
                additionalProperties: true
                required:
                - symbol
                - light
                - facts
                description: 'One coin: light, up to 3 facts with transaction links, cool-down, past incidents and proof.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: That ticker is not in the current snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security: []
  /api/v1/team-dump-radar/check/{symbol}:
    post:
      tags:
      - Team Dump Radar
      summary: Team Dump Radar Check
      operationId: team_dump_radar_check_api_v1_team_dump_radar_check__symbol__post
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  label:
                    type: string
                    description: Always "Based on addresses you entered, not verified as the team".
                  symbol:
                    type: string
                  chain:
                    type: string
                  contract:
                    type: string
                  window_days:
                    type: integer
                  addresses_read:
                    type: integer
                  complete:
                    type: boolean
                  headline:
                    type: string
                  sent_at_least:
                    type: number
                  untagged:
                    type: number
                  untagged_share:
                    type: number
                  untagged_pct:
                    type: string
                    description: untagged_share as the headline shows it (one rounding)
                  by_exchange:
                    type: object
                    properties: {}
                    additionalProperties: true
                  send_count:
                    type: integer
                  sends:
                    type: array
                    items:
                      type: object
                      properties:
                        ts:
                          type: integer
                        amount:
                          type: number
                        from:
                          type: string
                        to:
                          type: string
                        tx:
                          type: string
                        url:
                          type: string
                        exchange:
                          type: string
                        via_deposit:
                          type: boolean
                      additionalProperties: true
                  exchange_addresses:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                  notes:
                    type: array
                    items:
                      type: string
                  calls:
                    type:
                    - integer
                    - 'null'
                  light_changed:
                    type: boolean
                  stored:
                    type: boolean
                additionalProperties: true
                required:
                - label
                - headline
                - sent_at_least
                - sends
                description: 'One-time read of up to 5 wallets you paste for a grey coin: what they sent to exchange addresses in the last 180 days, with proof links. Nothing entered is stored; the coin''s light never changes; no share card.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Unknown ticker.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '409':
          description: The check is not offered on this coin (verified, stablecoin, or not on a chain we read).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '413':
          description: Body too long.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '429':
          description: Rate limited, another check running, or today's checks used up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '502':
          description: The block explorer did not answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - addresses
              properties:
                addresses:
                  description: Up to 5 wallet addresses (0x + 40 hex; base58 on Solana coins), as one string separated by spaces/commas/new lines or as a list. Never stored.
                  anyOf:
                  - type: string
                    maxLength: 600
                  - type: array
                    items:
                      type: string
                    maxItems: 10
      security: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Account session JWT (from /auth/login). Key-management routes accept only this — never an API key.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://cymetica.com/oauth/authorize
          tokenUrl: https://cymetica.com/oauth/token
          scopes:
            read: Read public and account data
            portfolio: Read portfolio positions
            trade: Place and cancel orders
