openapi: 3.2.0
info:
  title: EventTrader Public MCP Public Interface API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: MCP Public Interface
paths:
  /mcp/v1:
    post:
      tags:
      - MCP Public Interface
      summary: Mcp Jsonrpc
      description: MCP JSON-RPC over streamable HTTP — initialize / tools/list / tools/call.
      operationId: mcp_jsonrpc_mcp_v1_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    enum:
                    - '2.0'
                  id:
                    type:
                    - string
                    - integer
                    - 'null'
                  result:
                    type: object
                    properties: {}
                    additionalProperties: true
                    description: 'Method-specific: initialize -> {protocolVersion, capabilities, serverInfo, _meta}; tools/list -> {tools: [{name, title, description, inputSchema, annotations}], _meta}; tools/call -> {content: [{type: ''text'', text: <JSON>}], isError}; resources/list -> {resources: [{uri, name, description}]}; resources/read -> {contents: [{uri, mimeType, text}]}; ping -> {}.'
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                    additionalProperties: false
                    required:
                    - code
                    - message
                    description: 'JSON-RPC error: -32700 parse, -32600 invalid request, -32601 unknown method, -32602 bad params, -32002 resource not found, -32603 internal.'
                additionalProperties: false
                required:
                - jsonrpc
                - id
                description: 'JSON-RPC 2.0 response: exactly one of `result` / `error`. A notification (no id, method notifications/*) is answered 202 with an empty body.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                id:
                  type:
                  - string
                  - integer
                  - 'null'
                method:
                  type: string
                  description: initialize | ping | tools/list | tools/call | resources/list | resources/read | notifications/*
                params:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 'tools/call: tool name.'
                    arguments:
                      type: object
                      properties: {}
                      additionalProperties: true
                      description: 'tools/call: tool arguments.'
                    uri:
                      type: string
                      description: 'resources/read: resource URI.'
                  additionalProperties: true
              additionalProperties: false
              required:
              - jsonrpc
              - method
              description: Single JSON-RPC 2.0 request (batches are refused).
  /mcp/v1/capabilities:
    get:
      tags:
      - MCP Public Interface
      summary: Get Platform Capabilities
      description: Get platform capabilities for agent's trust level.
      operationId: get_platform_capabilities_mcp_v1_capabilities_get
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  protocol:
                    type: string
                  server:
                    type: object
                    properties:
                      name:
                        type: string
                      version:
                        type: string
                    additionalProperties: false
                  trust_level:
                    type: string
                    description: unknown | recognized | trusted | allied
                  capabilities:
                    type: object
                    properties:
                      tools:
                        type: integer
                      resources:
                        type: integer
                      messaging:
                        type: boolean
                      webhooks:
                        type: boolean
                      websocket:
                        type: boolean
                    additionalProperties: false
                    description: Counts and feature switches at this tier.
                  tools_summary:
                    type: array
                    items:
                      type: string
                  resources_summary:
                    type: array
                    items:
                      type: string
                  rate_limits:
                    type: object
                    properties:
                      requests_per_minute:
                        type: integer
                      requests_per_day:
                        type: integer
                    additionalProperties: false
                  timestamp:
                    type: string
                additionalProperties: false
                required:
                - protocol
                - server
                - trust_level
                - capabilities
                - tools_summary
                description: Platform capabilities at the caller's trust level (anonymous = unknown).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /mcp/v1/tools:
    get:
      tags:
      - MCP Public Interface
      summary: List Available Tools
      description: Get catalog of available tools (plus the caller's own trust level).
      operationId: list_available_tools_mcp_v1_tools_get
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  trust_level:
                    type: string
                    description: unknown | recognized | trusted | allied
                  total_tools:
                    type: integer
                  tools_by_tier:
                    type: object
                    description: Tier name -> tools callable at that tier.
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                          parameters:
                            type: object
                            properties: {}
                            additionalProperties: true
                            description: Parameter name -> spec.
                          returns: {}
                        additionalProperties: true
                        required:
                        - name
                  timestamp:
                    type: string
                  caller:
                    type: object
                    properties:
                      trust_level:
                        type: string
                      agent_id:
                        type:
                        - string
                        - 'null'
                    additionalProperties: false
                    description: The calling key's own effective trust level (unknown when anonymous).
                additionalProperties: false
                required:
                - trust_level
                - total_tools
                - tools_by_tier
                - caller
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /mcp/v1/agents/{agent_id}/claim:
    post:
      tags:
      - MCP Public Interface
      summary: Claim Agent Ownership
      description: 'Record that the calling PLATFORM account owns this agent.


        Authenticate as the human (JWT or evt_ account API key), not as the

        agent. Allowed when your account is verified and its email matches the

        agent''s registered contact_email. From then on your confirmed CentCom

        bugs, implemented feature requests, real CLOB fills and real-money

        headline positions count toward the agent''s trust score (reputation

        overlay only -- the agent still trades from its own funded account).'
      operationId: claim_agent_ownership_mcp_v1_agents__agent_id__claim_post
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  claimed:
                    type: boolean
                  new:
                    type: boolean
                    description: False when already claimed by you.
                  counted_identities:
                    type: array
                    items:
                      type: string
                  bugs_confirmed:
                    type: integer
                  clob_fills:
                    type: integer
                  headline_positions:
                    type: integer
                additionalProperties: false
                required:
                - agent_id
                - claimed
                - new
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Called with an agent key, or your verified account email does not match the agent's contact email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
  /mcp/v1/agents/{agent_id}/fund:
    post:
      tags:
      - MCP Public Interface
      summary: Fund Agent From Owner
      description: 'Move USDC between YOUR platform account and your agent''s spend account.


        Authenticate as the human owner (JWT or evt_ account API key). Allowed

        only for an agent you have claimed (POST /mcp/v1/agents/{agent_id}/claim,

        or registered while signed in). This is an internal ledger transfer

        between two accounts of the same person — nothing goes on-chain, nothing

        is charged. Your available (unlocked) balance is the ceiling; the same

        call with direction=to_owner brings it back. The agent trades from the

        spend account, so its orders use ONLY what you moved here.'
      operationId: fund_agent_from_owner_mcp_v1_agents__agent_id__fund_post
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentFundRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  direction:
                    type: string
                    enum:
                    - to_agent
                    - to_owner
                  currency:
                    type: string
                    enum:
                    - USDC
                  amount:
                    type: string
                    description: Decimal string, 6 dp.
                  reference:
                    type: string
                  owner_available_after:
                    type: string
                    description: Decimal string, USDC.
                  agent_available_after:
                    type: string
                    description: Decimal string, USDC.
                  note:
                    type: string
                additionalProperties: false
                required:
                - agent_id
                - direction
                - currency
                - amount
                - reference
                description: Internal ledger move between your account and the agent's spend account (nothing on-chain).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: Bad currency/direction, or amount exceeds the source account's available USDC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '403':
          description: Agent key used, or you have not claimed this agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '404':
          description: The agent has no spend account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
  /mcp/v1/register:
    post:
      tags:
      - MCP Public Interface
      summary: Register New Agent
      description: 'Register a new MCP agent.


        A register call that carries the human''s own JWT / account API key binds

        the new agent to that account (mcp_agent_owners) so its confirmed bugs

        and real fills count toward the agent''s trust from day one (ET-22493).


        Creates both an MCPAgent row and an APIKey row so the key works

        with both the MCP auth flow and the AgentBook verify_api_key flow.'
      operationId: register_new_agent_mcp_v1_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegistrationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegistrationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /mcp/v1/agents/mine:
    get:
      tags:
      - MCP Public Interface
      summary: List My Agents
      description: 'Your claimed agents with each spend account''s USDC balance (ET-22549).


        Authenticate as the HUMAN owner (browser session, JWT or evt_ account API

        key). Returns your own available USDC next to every agent''s, so a one-click

        move in either direction is a single follow-up call to

        POST /mcp/v1/agents/{agent_id}/fund. The Account page renders this panel.'
      operationId: list_my_agents_mcp_v1_agents_mine_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_user_id:
                    type: integer
                  owner_usdc_available:
                    type:
                    - string
                    - 'null'
                    description: Decimal string; null if the read failed.
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        trust_level:
                          type:
                          - string
                          - 'null'
                        is_active:
                          type: boolean
                        spend_user_id:
                          type:
                          - integer
                          - 'null'
                        usdc_available:
                          type:
                          - string
                          - 'null'
                          description: Decimal string.
                      additionalProperties: false
                  fund_endpoint:
                    type: string
                additionalProperties: false
                required:
                - owner_user_id
                - agents
        '403':
          description: Called with an agent key instead of the human owner's account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
  /mcp/v1/agents/me:
    get:
      tags:
      - MCP Public Interface
      summary: Get My Profile
      description: Get current agent's profile.
      operationId: get_my_profile_mcp_v1_agents_me_get
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type:
                    - string
                    - 'null'
                  organization:
                    type:
                    - string
                    - 'null'
                  role:
                    type:
                    - string
                    - 'null'
                  trust_level:
                    type: string
                    description: unknown | recognized | trusted | allied
                  trust_score:
                    type: number
                  is_verified:
                    type: boolean
                  created_at:
                    type:
                    - string
                    - 'null'
                  last_active_at:
                    type:
                    - string
                    - 'null'
                  metrics:
                    type: object
                    properties: {}
                    additionalProperties: true
                    description: Scoring metrics (observations, signals, clob_fills, bugs_confirmed, features_implemented, ...).
                  progress:
                    type: object
                    properties:
                      current_level:
                        type: string
                      next_level:
                        type:
                        - string
                        - 'null'
                      current_score:
                        type: number
                      points_needed:
                        type: number
                      next_threshold:
                        type: number
                      progress_percentage:
                        type: number
                      message:
                        type: string
                    additionalProperties: false
                  trading_mode:
                    type: object
                    properties:
                      account:
                        type:
                        - string
                        - 'null'
                        description: '"user:{id}" of the account the agent trades as.'
                      simulation_mode:
                        type:
                        - boolean
                        - 'null'
                      paper_balance_usdc:
                        type:
                        - string
                        - 'null'
                      note:
                        type: string
                      account_note:
                        type: string
                    additionalProperties: false
                  ai_nativeness:
                    type: object
                    properties:
                      score:
                        type: number
                      classification:
                        type:
                        - string
                        - 'null'
                      assessed_at:
                        type:
                        - string
                        - 'null'
                    additionalProperties: false
                    description: Present only when assessed.
                additionalProperties: false
                required:
                - id
                - name
                - trust_level
                - trust_score
                - metrics
                - progress
                - trading_mode
                description: The calling agent's profile (agent key required).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mcp/v1/tools/{tool_name}:
    post:
      tags:
      - MCP Public Interface
      summary: Invoke Tool
      description: Invoke an MCP tool.
      operationId: invoke_tool_mcp_v1_tools__tool_name__post
      parameters:
      - name: tool_name
        in: path
        required: true
        schema:
          type: string
          title: Tool Name
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolInvokeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  tool:
                    type: string
                  result:
                    type: object
                    properties: {}
                    additionalProperties: true
                    description: The tool's own result object.
                  latency_ms:
                    type: integer
                additionalProperties: false
                required:
                - success
                - tool
                - result
                - latency_ms
                description: Successful tool call. Failures are HTTP errors with `detail` {code, message} (or the tool's own typed failure payload with success=false and code).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: Tool reported a failure, or a parameter is missing/mistyped (detail.code says which).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '403':
          description: 'INSUFFICIENT_TRUST: the tool needs a higher trust tier.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '404':
          description: TOOL_NOT_FOUND.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '429':
          description: Rate limit for your trust tier exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
components:
  schemas:
    AgentFundRequest:
      properties:
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          title: Amount
          description: Amount to move (USDC)
        currency:
          type: string
          title: Currency
          description: Only USDC is supported
          default: USDC
        direction:
          type: string
          title: Direction
          description: 'to_agent: owner -> agent spend account; to_owner: agent -> owner'
          default: to_agent
      type: object
      required:
      - amount
      title: AgentFundRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AgentRegistrationRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 3
          title: Name
