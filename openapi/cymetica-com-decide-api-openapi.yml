          title: Label
      type: object
      required:
      - text
      - label
      title: Example
    Body_create_from_csv_api_v1_decide_classifiers_upload_post:
      properties:
        name:
          type: string
          title: Name
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
          default: 0.5
      type: object
      required:
      - name
      - file
      title: Body_create_from_csv_api_v1_decide_classifiers_upload_post
    PredictBody:
      properties:
        texts:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Texts
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        second_opinion:
          type: boolean
          title: Second Opinion
          default: true
      type: object
      title: PredictBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CreateBody:
      properties:
        name:
          type: string
          maxLength: 120
          title: Name
        examples:
          items:
            $ref: '#/components/schemas/Example'
          type: array
          title: Examples
        instructions:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Instructions
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
          default: 0.5
        learn_from_fallback:
          type: boolean
          title: Learn From Fallback
          default: true
      type: object
      required:
      - name
      - examples
      title: CreateBody
    ExamplesBody:
      properties:
        examples:
          items:
            $ref: '#/components/schemas/Example'
          type: array
          title: Examples
          default: []
      type: object
      title: ExamplesBody
    SettingsBody:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Threshold
        learn_from_fallback:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Learn From Fallback
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
      type: object
      title: SettingsBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
