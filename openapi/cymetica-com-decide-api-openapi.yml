openapi: 3.2.0
info:
  title: EventTrader Public Decide API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: decide
paths:
  /api/v1/decide:
    get:
      tags:
      - decide
      summary: About
      operationId: about_api_v1_decide_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  what:
                    type: string
                  evidence:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                  plans:
                    type: array
                    items:
                      type: object
                      properties:
                        plan:
                          type: string
                        name:
                          type: string
                        price_usdc_month:
                          type: string
                        classifiers:
                          type: integer
                        decisions_per_week:
                          type: integer
                      additionalProperties: false
                  limits:
                    type: object
                    properties:
                      labels:
                        type: integer
                      examples:
                        type: integer
                      min_examples_per_label:
                        type: integer
                      text_chars:
                        type: integer
                      batch:
                        type: integer
                    additionalProperties: true
                  fallback:
                    type: string
                  docs:
                    type: string
                  enabled:
                    type: boolean
                additionalProperties: true
                required:
                - name
                - plans
                - limits
                - enabled
      security: []
  /api/v1/decide/classifiers:
    get:
      tags:
      - decide
      summary: List Classifiers
      operationId: list_classifiers_api_v1_decide_classifiers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: string
                  classifier_limit:
                    type: integer
                  decisions_per_week:
                    type: integer
                  classifiers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: dc_…
                        name:
                          type: string
                        status:
                          type: string
                          description: queued | training | ready | failed
                        version:
                          type: integer
                          description: 0 until the first model is trained; a retrain serves the old version until the new one is ready.
                        servable:
                          type: boolean
                        labels:
                          type: array
                          items:
                            type: string
                        n_examples:
                          type: integer
                        threshold:
                          type: number
                          description: Results under this confidence are marked unsure.
                        learn_from_fallback:
                          type: boolean
                        expected_accuracy:
                          type:
                          - number
                          - 'null'
                          description: Accuracy on held-out examples (0-1).
                        expected_accuracy_linear_only:
                          type:
                          - number
                          - 'null'
                        held_out_examples:
                          type:
                          - integer
                          - 'null'
                        train_seconds:
                          type:
                          - number
                          - 'null'
                        error:
                          type:
                          - string
                          - 'null'
                        trained_at:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                      required:
                      - id
                      - name
                      - status
                      - version
                      - labels
                      description: A Decide classifier.
                additionalProperties: true
                required:
                - plan
                - classifier_limit
                - classifiers
        '401':
          description: No key or session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
