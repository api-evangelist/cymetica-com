                  name:
                    type: string
                  status:
                    type: string
                    description: queued | training | ready | failed
                  version:
                    type: integer
                    description: 0 until the first model is trained; a retrain serves the old version until the new one is ready.
                  servable:
                    type: boolean
                  labels:
                    type: array
                    items:
                      type: string
                  n_examples:
                    type: integer
                  threshold:
                    type: number
                    description: Results under this confidence are marked unsure.
                  learn_from_fallback:
                    type: boolean
                  expected_accuracy:
                    type:
                    - number
                    - 'null'
                    description: Accuracy on held-out examples (0-1).
                  expected_accuracy_linear_only:
                    type:
                    - number
                    - 'null'
                  held_out_examples:
                    type:
                    - integer
                    - 'null'
                  train_seconds:
                    type:
                    - number
                    - 'null'
                  error:
                    type:
                    - string
                    - 'null'
                  trained_at:
                    type:
                    - string
                    - 'null'
                  created_at:
                    type:
                    - string
                    - 'null'
                additionalProperties: true
                required:
                - id
                - name
                - status
                - version
                - labels
                description: A Decide classifier.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No key or session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '404':
          description: No such classifier on this account.
          content:
