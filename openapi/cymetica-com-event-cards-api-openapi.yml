                        id:
                          type: string
                        title:
                          type: string
                        summary:
                          type:
                          - string
                          - 'null'
                        image_url:
                          type:
                          - string
                          - 'null'
                        source_url:
                          type:
                          - string
                          - 'null'
                        report_url:
                          type:
                          - string
                          - 'null'
                        status:
                          type: string
                        card_url:
                          type: string
                        share_url:
                          type: string
                        share_price_usd:
                          type:
                          - string
                          - 'null'
                          description: 4-dp decimal string
                        index_base:
                          type: number
                        current_index:
                          type:
                          - number
                          - 'null'
                        pw_index:
                          type:
                          - number
                          - 'null'
                        pw_base:
                          type:
