  /api/v1/event-cards/positions:
    get:
      tags:
      - event-cards
      summary: My Positions
      description: 'The authenticated user''s Event Card positions with live valuation.


        Surfaces BOTH spot positions (event_card_positions: bull/bear) AND

        leveraged perp positions (evcdx_perp_positions: long/short). The

        perp short path was previously invisible on /positions — CentCom

        #5970 (expire76): "shorted event card doesn''t appear in positions".


        2026-10-09: one user holds 72,369 spot rows and this handler ran one card

        query PER ROW — 43-56 s per call (5 today), the phone gave up (nginx 499)

        and the request kept a threadpool slot for the duration. Cards are now

        fetched in one query per 1,000 distinct ids, and callers that render a

        subset (the account card: open rows + 10 closed) can ask for exactly that.

        Defaults are unchanged for the public API: every row, newest first.'
      operationId: my_positions_api_v1_event_cards_positions_get
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
