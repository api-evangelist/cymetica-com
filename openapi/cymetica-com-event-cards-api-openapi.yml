openapi: 3.2.0
info:
  title: EventTrader Public Event Cards API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: event-cards
paths:
  /api/v1/event-cards/backtest-idea:
    post:
      tags:
      - event-cards
      summary: Backtest Event Card Idea
      description: 'Historical what-if backtest of an ad-hoc basket idea.


        Read-only: no card is created, no ledger or on-chain writes, no money

        moves. Reuses the same engine (run_basket_backtest) as the saved-card

        backtest, so an idea and a published card with the same basket return

        identical numbers.


        Two distinct exclusion lists in the response:

        * ``unresolved_symbols`` — constituents we couldn''t map to a price

        source at all (bad/unknown ticker, or a crypto leg with no

        coingecko_id we could resolve).

        * ``dropped_symbols`` — resolved to a price source fine, but had no

        price history in the requested window (newly listed, etc.); weights

        renormalized over the rest.


        ``requested_weight_covered`` (0..1) is ALWAYS in the response — the

        fraction of the basket''s requested weight that actually priced. If it

        falls below 80% the endpoint returns 422 INSUFFICIENT_BASKET_COVERAGE

        instead of a headline return that would describe a different

        (substitute) basket than the one requested (ET-25808 — a published

        8-leg basket that lost 6 legs to unresolved/no-data equities

        previously renormalized onto the 2 survivors and returned a -85%

        "card result" that was really a 98.5%-weighted single equity leg).'
      operationId: backtest_event_card_idea_api_v1_event_cards_backtest_idea_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestIdeaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  card_id:
                    type:
                    - string
                    - 'null'
                  period_days:
                    type: integer
                  starting_capital_usdc:
                    type: number
                  ending_capital_usdc:
                    type: number
                  total_return_pct:
                    type: number
                  sharpe_ratio:
                    type:
                    - number
                    - 'null'
                  max_drawdown_pct:
                    type:
                    - number
                    - 'null'
                  equity_curve:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        type: number
                  basket:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  dropped_symbols:
                    type: array
                    items:
                      type: string
                  unresolved_symbols:
                    type: array
                    items:
                      type: string
                  n_points:
                    type: integer
                  started_at:
                    type: string
                  ended_at:
                    type: string
                additionalProperties: true
                required:
                - period_days
                - starting_capital_usdc
                - ending_capital_usdc
                - total_return_pct
                description: Historical buy-and-hold backtest of a basket idea (BacktestResult.as_dict).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/event-cards/{card_id}/paper-trade:
    post:
      tags:
      - event-cards
      summary: Paper Trade Event Card Basket
      description: 'Paper-trade a card''s whole basket: split the notional across its legs by

        weight and open SIMULATED positions at live spot, in a per-card paper book

        (``ec:``).


        The bridge from "backtest an idea" to "watch it run" — no real funds move,

        nothing is withdrawable (the same catalog paper rail as the Asset Universe

        page). Read the result back any time via

        ``GET /api/v1/universe/paper/portfolio?book=ec:``.'
      operationId: paper_trade_event_card_basket_api_v1_event_cards__card_id__paper_trade_post
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          title: Card Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperTradeBasketRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  reason:
                    type:
                    - string
                    - 'null'
                  card_id:
                    type: string
                  book:
                    type: string
                    description: Paper book id `ec:<card_id>`
                  run_ref:
                    type: string
                  side:
                    type: string
                  requested_usd:
                    type: string
                    description: Decimal as a string
                  filled_usd:
                    type: string
                    description: Decimal as a string
                  coverage:
                    type: number
                    description: Fraction of legs filled (0..1)
                  weight_coverage:
                    type: number
                    description: Fraction of basket weight filled (0..1)
                  skipped_weight:
                    type: number
                  full_coverage:
                    type: boolean
                  fills:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        weight:
                          type: string
                        target_usd:
                          type: string
                        status:
                          type: string
                          enum:
                          - filled
                          - skipped
                        asset_class:
                          type:
                          - string
                          - 'null'
                        quantity: {}
                        price_usd: {}
                        reason:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                  portfolio:
                    type: object
                    properties: {}
                    additionalProperties: true
                    description: The paper book's priced portfolio summary.
                additionalProperties: true
                required:
                - ok
                - card_id
                - book
                - fills
                description: Simulated basket fill; no real funds move.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Event Card not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '503':
          description: Paper trade temporarily unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
  /api/v1/event-cards/{card_id}/historical-analogs:
    post:
      tags:
      - event-cards
      summary: Historical Analogs
      description: 'How did events LIKE this one perform historically?


        Finds up to ``limit`` real PAST events similar to this card (same sector +

        sentiment sign, ranked by asset-profile overlap), builds each one''s basket

        index over the ``window_days`` FOLLOWING its event date, and returns every

        series (re-keyed by day-offset for overlay) plus the distribution of forward

        returns. Read-only: no money, no card creation. Grounded in the real

        headline corpus — a thin corpus returns fewer than ``limit`` (the real

        count), never a fabricated event.'
      operationId: historical_analogs_api_v1_event_cards__card_id__historical_analogs_post
      security: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          title: Card Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalAnalogsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  card_id:
                    type: string
                  sector:
                    type:
                    - string
                    - 'null'
                  window_days:
                    type: integer
                  subject:
                    anyOf:
                    - type: object
                      properties:
                        title:
                          type: string
                        event_date:
                          type: string
                        return_pct:
                          type:
                          - number
                          - 'null'
                        max_drawdown_pct:
                          type:
                          - number
                          - 'null'
                        n_days:
                          type: integer
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              d:
                                type: integer
                                description: Day offset from the event date
                              index:
                                type: number
                            additionalProperties: true
                        in_progress:
                          type: boolean
                      additionalProperties: true
                    - type: 'null'
                  analogs:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        event_date:
                          type: string
                        return_pct:
                          type:
                          - number
                          - 'null'
                        max_drawdown_pct:
                          type:
                          - number
                          - 'null'
                        n_days:
                          type: integer
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              d:
                                type: integer
                                description: Day offset from the event date
                              index:
                                type: number
                            additionalProperties: true
                        headline_id: {}
                        similarity:
                          type: number
                        card_id:
                          type:
                          - string
                          - 'null'
                        basket:
                          type: array
                          items:
                            type: object
                            properties:
                              symbol:
                                type: string
                              weight:
                                type: number
                            additionalProperties: true
                      additionalProperties: true
                  aggregate:
                    type: object
                    properties:
                      count:
                        type: integer
                      median_return_pct:
                        type:
                        - number
                        - 'null'
                      mean_return_pct:
                        type:
                        - number
                        - 'null'
                      pct_positive:
                        type:
                        - number
                        - 'null'
                      best:
                        anyOf:
                        - type: object
                          properties:
                            title:
                              type: string
                            event_date:
                              type: string
                            return_pct:
                              type: number
                          additionalProperties: true
                        - type: 'null'
                      worst:
                        anyOf:
                        - type: object
                          properties:
                            title:
                              type: string
                            event_date:
                              type: string
                            return_pct:
                              type: number
                          additionalProperties: true
                        - type: 'null'
                      median_series:
                        type: array
                        items:
                          type: object
                          properties:
                            d:
                              type: integer
                              description: Day offset from the event date
                            index:
                              type: number
                          additionalProperties: true
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      candidates_scanned:
                        type: integer
                      matched:
                        type: integer
                      requested_limit:
                        type: integer
                      note:
                        type: string
                    additionalProperties: true
                additionalProperties: true
                required:
                - card_id
                - analogs
                - aggregate
                description: Forward returns of real past events similar to this card (returns in percent).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Event Card not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
        '503':
          description: Historical analogs temporarily unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
  /api/v1/event-cards:
    get:
      tags:
      - event-cards
      summary: List Event Cards
      description: 'List Event Cards (defaults to live cards), newest first.


        ``origin=''aib_rally''`` (the Rally Cards deck) is ordered by SPIKE SIZE

        instead — biggest measured move at the top, either direction — with

        newest-first as the tiebreak for cards that predate the measurement.


        User-submitted cards are filtered out by default; toggle

        ``include_user_submitted=true`` to see the full firehose.


        Pagination: ``offset``/``skip``/``page`` all move the window (ET-24574

        — offset was previously accepted but silently ignored, stranding any

        card past the first page of the default feed, e.g. an older

        user-submitted card unreachable at any offset). ``total`` in the

        response is the true row count under the active filter; ``count``

        stays the number of rows in THIS page (unchanged key, for backward

        compatibility). ``q``/``search``/``symbol`` filter the same feed.'
      operationId: list_event_cards_api_v1_event_cards_get
      security: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: live
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: 'Row offset for pagination (0-based). Alias: skip.'
          default: 0
          title: Offset
        description: 'Row offset for pagination (0-based). Alias: skip.'
      - name: skip
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Alias for offset.
          title: Skip
        description: Alias for offset.
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: 1-based page number; offset = (page-1)*limit. Takes precedence over offset/skip when given.
          title: Page
        description: 1-based page number; offset = (page-1)*limit. Takes precedence over offset/skip when given.
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Case-insensitive substring match on card title or tradable symbol (EVCDX-*/AIB-*). Alias: search.'
          title: Q
        description: 'Case-insensitive substring match on card title or tradable symbol (EVCDX-*/AIB-*). Alias: search.'
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Alias for q.
          title: Search
        description: Alias for q.
      - name: symbol
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact (case-insensitive) match on the card's tradable symbol (EVCDX-*/AIB-*).
          title: Symbol
        description: Exact (case-insensitive) match on the card's tradable symbol (EVCDX-*/AIB-*).
      - name: origin
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to a single card origin (e.g. 'aib_rally' for the Rally Cards deck). Omitted → the full curated feed.
          title: Origin
        description: Filter to a single card origin (e.g. 'aib_rally' for the Rally Cards deck). Omitted → the full curated feed.
      - name: include_user_submitted
        in: query
        required: false
        schema:
          type: boolean
          description: If true, include user-submitted cards in the result. Default is false so the curated system feed stays clean — user-submitted cards are reachable via the user's own /positions or by passing this flag explicitly.
          default: false
          title: Include User Submitted
        description: If true, include user-submitted cards in the result. Default is false so the curated system feed stays clean — user-submitted cards are reachable via the user's own /positions or by passing this flag explicitly.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      type: object
