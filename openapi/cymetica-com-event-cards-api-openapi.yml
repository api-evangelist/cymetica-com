      - name: interval
        in: query
        required: false
        schema:
          type: string
          pattern: ^(1d|5d|30d|all)$
          description: 1d | 5d | 30d | all. all = since inception (use it for settled cards older than the window; the default 5d returns an empty points list for them).
          default: 5d
