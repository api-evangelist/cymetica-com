          description: The Manager's plan, in the order the runner takes it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id:
                          type: integer
                        position:
                          type: integer
                          description: 1 = runs next
                        department_id:
                          type: integer
                        department:
                          type:
                          - string
                          - 'null'
                        title:
                          type: string
                        why:
                          type: string
