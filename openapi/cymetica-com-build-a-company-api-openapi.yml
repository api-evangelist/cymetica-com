openapi: 3.2.0
info:
  title: EventTrader Public Build a Company API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Build a Company
paths:
  /api/v1/company/templates:
    get:
      tags:
      - Build a Company
      summary: Get Templates
      operationId: get_templates_api_v1_company_templates_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  departments:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        charter:
                          type: string
                        experts:
                          type: array
                          items:
                            type: string
                      additionalProperties: true
                  experts:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        fits:
                          type: array
                          items:
                            type: string
                        description:
                          type: string
                          description: One line on what the expert does; on the Auditor it also says how it differs from the built-in company-wide weekly audit.
                        brief:
                          type: string
                          description: The full role brief the expert is prompted with.
                        tools:
                          type: array
                          items:
                            type: string
                          description: Tools the expert brings (empty = none).
                        capabilities:
                          type: array
                          items:
                            type: string
                          description: What the expert can and cannot do, in plain words.
                        permissions_by_department:
                          type: array
                          items:
                            type: object
                            properties:
                              department:
                                type: string
                              approvals:
                                type: array
                                items:
                                  type: string
                              paper_experiments:
                                type: boolean
                            additionalProperties: false
                            required:
                            - department
                            - approvals
                            - paper_experiments
                      additionalProperties: false
                      required:
                      - key
                      - name
                      - fits
                  report_styles:
                    type: array
                    items:
                      type: string
                additionalProperties: true
                required:
                - departments
                - experts
                - report_styles
                description: Department templates, the expert catalog and report styles for POST /api/v1/company.
      security: []
  /api/v1/company/:
    post:
      tags:
      - Build a Company
      summary: Create
      description: 'Create your company — one per account (409 when you already have one).


        Body: ``{"name", "mission", "departments": [...], "report_style"?, "token_chain"?}``.

        Each department is a template (``{"key": "testing"}`` — development, design, testing,

        testing_lab, trading_desk; override ``name`` / ``charter`` / ``experts`` freely) or your own

        (``{"name", "charter", "experts": [...]}``). The charter (up to 2,000 characters) is the

        department''s standing brief: put your rules, notes and lessons there and every task it runs

        starts from them. Experts come from GET /templates (qa_tester, researcher, trader, developer,

        lab_scientist, auditor, designer). Departments can be added, edited or removed later with

        POST/PATCH/DELETE /{id}/departments. Returns the same shape as GET /mine (201).

        Paper by default: the company never spends, trades real money, publishes or submits without

        your approval, and every agent turn is metered to YOUR NEXUS build plan, never the platform.'
      operationId: create_api_v1_company__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  mission:
                    type: string
                  status:
                    type: string
                  created_at:
                    type:
                    - string
                    - 'null'
                  report_style:
                    type: string
                  departments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        key:
                          type: string
                        name:
                          type: string
                        charter:
                          type: string
                        experts:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            additionalProperties: true
                        status:
                          type: string
                          description: working (a task runs now), blocked (escalated / waiting for approval), queued (work waits; `waits` says why and until when) or idle.
                        waits:
                          type:
                          - object
                          - 'null'
                          additionalProperties: true
                          description: 'Why queued work waits: {code, text, until}. code: paused | plan_limit | free_plan | daily_cap | capacity | usage_unavailable | retry | next_pass.'
                        units_7d:
                          type: string
                          description: Plan units this department's turns were metered in the last 7 days.
                        tasks:
                          type: object
                          properties: {}
                          additionalProperties: true
                          description: Task counts by status.
                        recent_results:
                          type: array
                          items:
                            type: object
                            properties:
                              task_id:
                                type: integer
                              title:
                                type: string
                              outcome:
                                type:
                                - string
                                - 'null'
                              finished_at:
                                type:
                                - string
                                - 'null'
                            additionalProperties: true
                        cost_usd_7d:
                          type:
                          - number
                          - 'null'
                        memory_count:
                          type: integer
                      additionalProperties: true
                      required:
                      - id
                      - key
                      - name
                      - status
                      description: One department with its hired experts and task state.
                  approvals:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        department:
                          type:
                          - string
                          - 'null'
                        kind:
                          type: string
                        summary:
                          type: string
                        details:
                          type: object
                          properties: {}
                          additionalProperties: true
                        status:
                          type: string
                        created_at:
                          type:
                          - string
                          - 'null'
                        executable:
                          type: boolean
                          description: True when approving performs the action itself.
                      additionalProperties: true
                      required:
                      - id
                      - kind
                      - status
                  tasks_recent:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        department:
                          type:
                          - string
                          - 'null'
                        title:
                          type: string
                        status:
                          type: string
                        attempts:
                          type: integer
                        updated_at:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                  manager_messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        role:
                          type: string
                        text:
                          type: string
                        created_at:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                      required:
                      - id
                      - role
                      - text
                  last_audit:
                    oneOf:
                    - type: object
                      properties:
                        id:
                          type: integer
                        created_at:
                          type:
                          - string
                          - 'null'
                        findings:
                          type: array
                          items:
                            type: object
                            properties: {}
                            additionalProperties: true
                            description: One finding with its proposed fix.
                      additionalProperties: true
                      required:
                      - id
                      - findings
                      description: One built-in company-wide audit run.
                    - type: 'null'
                  budget:
                    type: object
                    properties:
                      turns_today:
                        type: integer
                      turns_cap:
                        type: integer
                    additionalProperties: true
                  billing:
                    type: object
                    properties: {}
                    additionalProperties: true
                    description: Plan / usage state for the company's agent turns.
                  events_recent:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        kind:
                          type: string
                        department_id:
                          type:
                          - integer
                          - 'null'
                        task_id:
                          type:
                          - integer
                          - 'null'
                        title:
                          type: string
                        detail:
                          type: string
                        created_at:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                      required:
                      - id
                      - kind
                      description: One live-office event (what the agents did).
                  token_launch:
                    type:
                    - object
                    - 'null'
                    description: The standing token-launch offer, or null.
                  investable:
                    type: object
                    properties:
                      investable:
                        type: boolean
                      mode:
                        type: string
                      since:
                        type:
                        - string
                        - 'null'
                      terms:
                        type: object
                        properties:
                          backer_share_pct:
                            type: number
                          backer_cap_x:
                            type: number
                          locked:
                            type: boolean
                          locked_at:
                            type:
                            - string
                            - 'null'
                          version:
                            type: string
                          url:
                            type: string
                        additionalProperties: true
                        required:
                        - backer_share_pct
                        - backer_cap_x
                        - locked
                      public_url:
                        type:
                        - string
                        - 'null'
                      backers:
                        type: integer
                      pledged_usdc:
                        type: number
                      available_usdc:
                        type: number
                      covered_usdc:
                        type: number
                      proceeds_shared_usdc:
                        type: number
                    additionalProperties: true
                    required:
                    - investable
                    - mode
                    - terms
                    description: The owner's Investable switch and backing totals.
                  entity:
                    oneOf:
                    - type: object
                      properties:
                        id:
                          type: integer
                        domicile_code:
                          type: string
                        domicile_name:
                          type: string
                        off_world:
                          type: boolean
                        registered_via:
                          type:
                          - string
                          - 'null'
                        registered_via_name:
                          type:
                          - string
                          - 'null'
                        entity_type_key:
                          type:
                          - string
                          - 'null'
                        entity_type_name:
                          type:
                          - string
                          - 'null'
                        legal_name:
                          type:
                          - string
                          - 'null'
                        status:
                          type: string
                        next_step:
                          type: string
                        registration_number:
                          type:
                          - string
                          - 'null'
                        incorporated_at:
                          type:
                          - string
                          - 'null'
                        share_currency:
                          type:
                          - string
                          - 'null'
                        share_classes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              code:
                                type: string
                              name:
                                type: string
                              authorized:
                                type: number
                              issued:
                                type: number
                              par_value:
                                type: number
                              votes_per_share:
                                type: number
                              liquidation_preference_x:
                                type: number
                              dividend_pref_pct:
                                type: number
                              participating:
                                type: boolean
                              convertible:
                                type: boolean
                              for_backers:
                                type: boolean
                              issue_price_usdc:
                                type:
                                - number
                                - 'null'
                            additionalProperties: true
                        shares_issued_total:
                          type: number
                        ownership_by_source:
                          type: object
                          properties: {}
                          additionalProperties: true
                        editable:
                          type: boolean
                        off_world_note:
                          type: string
                        registered_office:
                          type:
                          - string
                          - 'null'
                        fiscal_year_end:
                          type:
                          - string
                          - 'null'
                        directors:
                          type: array
                          items:
                            type: object
                            properties: {}
                            additionalProperties: true
                        governance:
                          type: object
                          properties: {}
                          additionalProperties: true
                        quote:
                          type:
                          - object
                          - 'null'
                        formation_paid_usdc:
                          type: number
                        notes:
                          type:
                          - string
                          - 'null'
                        requested_at:
                          type:
                          - string
                          - 'null'
                        quoted_at:
                          type:
                          - string
                          - 'null'
                        paid_at:
                          type:
                          - string
                          - 'null'
                        filed_at:
                          type:
                          - string
                          - 'null'
                        desk_issue_id:
                          type:
                          - integer
                          - 'null'
                        register:
                          type: array
                          items:
                            type: object
                            properties:
                              class:
                                type:
                                - string
                                - 'null'
                              holder:
                                type:
                                - string
                                - 'null'
                              user_id:
                                type:
                                - integer
                                - 'null'
                              shares:
                                type: number
                              paid_usdc:
                                type: number
                              source:
                                type: string
                              status:
                                type: string
                              vesting:
                                type:
                                - object
                                - 'null'
                            additionalProperties: true
                        events:
                          type: array
                          items:
                            type: object
                            properties:
                              kind:
                                type: string
                              detail:
                                type:
                                - string
                                - 'null'
                              actor:
                                type:
                                - string
                                - 'null'
                              at:
                                type:
                                - string
                                - 'null'
                            additionalProperties: true
                      additionalProperties: true
                      required:
                      - id
                      - domicile_code
                      - status
                      description: 'The company''s legal entity: domicile, equity structure, formation status.'
                    - type: 'null'
                    description: null until the owner drafts an entity.
                  equity_perp:
                    type:
                    - object
                    - 'null'
                    description: The founder's pre-IPO equity perp on the company, or the offer.
                additionalProperties: true
                required:
                - id
                - name
                - mission
                - status
                - departments
                description: Full status of the owner's company.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 'Not signed in: send a Bearer JWT or an X-API-Key.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
  /api/v1/company/mine:
    get:
      tags:
      - Build a Company
      summary: Mine
      operationId: mine_api_v1_company_mine_get
      responses:
        '200':
          description: 'Your company: departments, tasks and run_state.'
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  mission:
                    type: string
                  status:
                    type: string
                  report_style:
                    type: string
                  created_at:
                    type:
                    - string
                    - 'null'
                  departments:
                    items:
                      type: object
                    type: array
                  approvals:
                    items:
                      type: object
                    type: array
                  manager_messages:
                    items:
                      type: object
                    type: array
                  tasks_recent:
                    items:
                      type: object
                    type: array
                  events_recent:
                    items:
                      type: object
                    type: array
                  last_audit:
                    type:
                    - object
                    - 'null'
                  budget:
                    properties:
                      turns_today:
                        type: integer
                      turns_cap:
                        type: integer
                        description: The daily ceiling.
                      units_per_turn:
                        type:
                        - string
                        - 'null'
                        description: Measured average plan units of the last 20 company turns.
                      units_per_turn_basis:
                        type: string
                      turns_measured:
                        type: integer
                      extra_usage:
                        type: boolean
                      at_zero:
                        type:
                        - string
                        - 'null'
                        description: What happens when a window runs out.
                      usage_url:
                        type: string
                      windows:
                        properties:
                          five_hour:
                            properties:
                              units_used:
                                type: string
                              units_cap:
                                type: string
                              units_left:
                                type: string
                              turns_left:
                                type:
                                - integer
                                - 'null'
                                description: units_left / units_per_turn, rounded down; null before a measured turn.
                              resets_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                            type: object
                          weekly:
                            properties:
                              units_used:
                                type: string
                              units_cap:
                                type: string
                              units_left:
                                type: string
                              turns_left:
                                type:
                                - integer
                                - 'null'
                                description: units_left / units_per_turn, rounded down; null before a measured turn.
                              resets_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                            type: object
                          extra:
                            properties:
                              enabled:
                                type: boolean
                              usdc_left:
                                type:
                                - string
                                - 'null'
                              usdc_per_turn:
                                type:
                                - string
                                - 'null'
                              turns_left:
                                type:
                                - integer
                                - 'null'
                              monthly_cap_usdc:
                                type:
                                - string
                                - 'null'
                              month_spend_usdc:
                                type:
                                - string
                                - 'null'
                              limited_by:
                                type:
                                - string
                                - 'null'
                                enum:
                                - balance
                                - monthly_cap
                                - null
                            type: object
                            description: Turns left on extra usage (own USDC, within the monthly cap).
                        type:
                        - object
                        - 'null'
                    type: object
                    required:
                    - turns_today
                    - turns_cap
                    description: Turns left on the owner's plan; read-only, nothing reserved or charged.
                  plan:
                    items:
                      type: object
                    type: array
                    description: The Manager's plan (GET /{id}/plan).
                  turn_strip:
                    items:
                      properties:
                        state:
                          type: string
                          enum:
                          - done
                          - failed
                          - running
                      type: object
                    type: array
                    description: One cell per agent turn today, up to turns_cap.
                  totals_7d:
                    properties:
                      tasks_done:
                        type: integer
                      tasks_failed:
                        type: integer
                      units:
                        type: string
                      approvals_approved:
                        type: integer
                    type: object
                  heartbeat:
                    properties:
                      last_pass_at:
                        type:
                        - string
                        - 'null'
                      next_pass_at:
                        type:
                        - string
                        - 'null'
                        description: 'Null while paused or when the runner has stopped passing: no pass is promised.'
                      pass_every_s:
                        type:
                        - integer
                        - 'null'
                    type: object
                  message_notice:
                    type:
                    - object
                    - 'null'
                    description: When the Manager answers a waiting message.
                  investable:
                    type:
                    - object
                    - 'null'
                  entity:
                    type:
                    - object
                    - 'null'
                  token_launch:
                    type:
                    - object
                    - 'null'
                  run_state:
                    properties:
                      state:
                        type: string
                        enum:
                        - paused
                        - blocked
                        - running
                        - stale
                        - waiting
                        - idle
                      code:
                        type: string
                        description: paused | daily_cap | capacity | running | runner_stale | waiting | idle | a plan wall code (lower case)
                      message:
                        type: string
                        description: Plain sentence the owner can act on.
                      can_run:
                        type: boolean
                        description: true for running, waiting and idle.
                      reason:
                        type: string
                        description: Plan wall reason, when code is a plan wall.
                      resets_at:
                        type: string
                        format: date-time
                        description: 'When a wall that clears by itself clears (daily cap: 00:00 UTC).'
                      upgrade_url:
                        type: string
                        description: Where to get a paid plan, for a plan wall.
                      open:
                        properties:
                          queued:
                            type: integer
                          running:
                            type: integer
                          escalated:
                            type: integer
                          waiting_approval:
                            type: integer
                          messages_pending:
                            type: integer
                        type: object
                      last_pass_at:
                        type: string
                        format: date-time
                        nullable: true
                      pass_every_s:
                        type: integer
                      turns_today:
                        type: integer
                      turns_cap:
                        type: integer
                    type: object
                    required:
                    - state
                    - code
                    - message
                    - can_run
                    - open
                    - pass_every_s
                    - turns_today
                    - turns_cap
                    description: Why the company is or is not running right now; read-only, nothing is charged.
                additionalProperties: true
                type: object
        '404':
          description: '{"detail": "no company"} when you have none.'
        '401':
          description: 'Not signed in: send a Bearer JWT or an X-API-Key.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
  /api/v1/company/{company_id}:
    delete:
      tags:
      - Build a Company
      summary: Delete
      operationId: delete_api_v1_company__company_id__delete
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          title: Company Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  deleted:
                    type: boolean
                additionalProperties: true
                required:
                - id
                - deleted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 'Not signed in: send a Bearer JWT or an X-API-Key.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    anyOf:
                    - type: string
                    - type: object
                      properties:
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          additionalProperties: true
                          required:
                          - code
                          - message
                      additionalProperties: true
                      required:
                      - error
                    - type: object
                additionalProperties: true
                required:
                - detail
                description: 'Error body: `detail` is a message string or an `{error: {code, message}}` object.'
  /api/v1/company/{company_id}/message:
    post:
      tags:
      - Build a Company
      summary: Message
      operationId: message_api_v1_company__company_id__message_post
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          title: Company Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
