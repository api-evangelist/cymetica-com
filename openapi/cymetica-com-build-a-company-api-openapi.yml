components:
  schemas:
    DepartmentIn:
      properties:
        key:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Key
          description: Template key (development | design | testing | testing_lab | trading_desk) or your own slug; 'manager' is reserved.
        name:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Name
          description: Shown on the dashboard; required for a custom department when key is omitted.
        charter:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Charter
          description: The department's standing brief (its rules, what done looks like, what it already knows). Required for a custom department.
        experts:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          title: Experts
          description: Catalog expert keys (or {key} objects); at least one for a custom department.
      type: object
      title: DepartmentIn
      description: 'One department. Either a TEMPLATE (``key`` from GET /templates: development, design,

        testing, testing_lab, trading_desk — name, charter and experts filled in from the template,

        any of them overridable) or YOUR OWN: a ``name`` (the key is derived from it when ``key`` is

        omitted), a ``charter`` of up to 2,000 characters — this text IS the department''s standing

        brief, every task it runs is prompted with it — and at least one expert from the catalog

        (qa_tester, researcher, trader, developer, lab_scientist, auditor, designer). A custom

        department may run paper experiments and may raise any approval kind.'
      examples:
      - key: testing
      - charter: 'Our lab''s working rules: one asset, one direction, a threshold and a window fixed before the start; judged from real prices. Lessons so far: ...'
        experts:
        - lab_scientist
        - qa_tester
        name: Paper lab
    DecisionIn:
      properties:
        decision:
          type: string
          maxLength: 10
          title: Decision
        note:
          type: string
          maxLength: 1000
          title: Note
          default: ''
      type: object
      required:
      - decision
      title: DecisionIn
    MessageIn:
      properties:
        text:
          type: string
          maxLength: 4000
          minLength: 1
          title: Text
      type: object
      required:
      - text
      title: MessageIn
    PledgeIn:
      properties:
        amount_usdc:
          type: number
          exclusiveMinimum: 0.0
          title: Amount Usdc
        accept_terms:
          type: boolean
          title: Accept Terms
          default: false
      type: object
      required:
      - amount_usdc
      title: PledgeIn
    PlanMoveIn:
      properties:
        direction:
          type: string
          pattern: ^(up|down|top)$
          title: Direction
          description: up | down | top
      type: object
      required:
      - direction
      title: PlanMoveIn
    WithdrawIn:
      properties:
        amount_usdc:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Amount Usdc
      type: object
      title: WithdrawIn
    CompanyIn:
      properties:
        name:
          type: string
          maxLength: 120
          title: Name
          description: 2 to 120 characters.
        mission:
          type: string
          maxLength: 2000
          title: Mission
          description: 10 to 2,000 characters; every Manager and department turn is prompted with it.
        departments:
          items:
            $ref: '#/components/schemas/DepartmentIn'
          type: array
          title: Departments
          description: 1 to 8 departments, template or custom; keys unique.
        report_style:
          type: string
          maxLength: 40
          title: Report Style
          description: How the Manager reports (free text; brief | detailed | daily_digest suggested).
          default: brief
        token_chain:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Token Chain
          description: 'Optional: a chains[].key from GET /api/v1/token-launch/chains to record where the company''s token should launch.'
      type: object
      required:
      - name
      - mission
      - departments
      title: CompanyIn
      description: 'Create your company (one per account). ``departments`` takes 1 to 8 entries, template or

        custom, keys unique. ``report_style`` is free text the Manager writes in (brief | detailed |

        daily_digest are suggested).'
      examples:
      - departments:
        - key: testing
        - charter: 'Our desk''s notes and rules: ... Paper only; any real-money action waits for my approval.'
          key: trading_desk
        - charter: 'Our lab''s working rules and lessons: ...'
          experts:
          - lab_scientist
          - qa_tester
          name: Paper lab
        mission: Find and prove ways to make money on Cymetica, on paper first.
        name: Acme Labs
        report_style: brief
    InvestableIn:
      properties:
        enabled:
          type: boolean
          title: Enabled
        backer_share_pct:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: 10.0
          - type: 'null'
          title: Backer Share Pct
        backer_cap_x:
          anyOf:
          - type: number
            maximum: 5.0
            minimum: 2.0
          - type: 'null'
          title: Backer Cap X
      type: object
      required:
      - enabled
      title: InvestableIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    EntityDraftIn:
      properties:
        domicile_code:
          anyOf:
          - type: string
            maxLength: 8
          - type: 'null'
          title: Domicile Code
        registered_via:
          anyOf:
          - type: string
            maxLength: 2
          - type: 'null'
          title: Registered Via
        entity_type_key:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Entity Type Key
        legal_name:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Legal Name
        share_classes:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Share Classes
        register:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Register
        directors:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Directors
        governance:
          anyOf:
          - type: object
          - type: 'null'
          title: Governance
        fiscal_year_end:
          anyOf:
          - type: string
            maxLength: 5
          - type: 'null'
          title: Fiscal Year End
        share_currency:
          anyOf:
          - type: string
            maxLength: 8
          - type: 'null'
          title: Share Currency
        registered_office:
          anyOf:
          - type: string
            maxLength: 400
          - type: 'null'
          title: Registered Office
        notes:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Notes
      type: object
      title: EntityDraftIn
    EntityRequestIn:
      properties:
        accept_platform_stake:
          type: boolean
          title: Accept Platform Stake
          description: 'Required true: you accept Cymetica''s published 1–10% stake rule for this request (GET /api/v1/company/formation-guide → platform_stake). Recorded with the request.'
          default: false
      type: object
      title: EntityRequestIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Account session JWT (from /auth/login). Key-management routes accept only this — never an API key.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://cymetica.com/oauth/authorize
          tokenUrl: https://cymetica.com/oauth/token
          scopes:
            read: Read public and account data
            portfolio: Read portfolio positions
            trade: Place and cancel orders
