                          type: integer
                          description: One agent turn per attempt.
                        turns_max:
                          type: integer
                          description: Turns it may take with retries.
                        units_expected:
                          type:
                          - string
                          - 'null'
                          description: Plan units per turn (measured average).
                        next_attempt_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        last_error:
                          type:
                          - string
                          - 'null'
                        waits:
                          type:
                          - object
                          - 'null'
                          description: Why it waits, in a few words, and until when (ISO time) when that is known.
                          properties:
                            code:
                              type: string
                              enum:
                              - paused
                              - plan_limit
                              - free_plan
                              - daily_cap
                              - capacity
                              - usage_unavailable
                              - retry
                              - next_pass
                              - wall
                            text:
                              type: string
                            until:
                              type:
                              - string
                              - 'null'
                              format: date-time
                      required:
