                        event_card:
                          type:
                          - object
                          - 'null'
                          description: '{id, url} of the headline''s Event Card, if one exists.'
                        actions:
                          type: object
                          properties:
                            make_event_card:
                              type:
                              - string
                              - 'null'
                          additionalProperties: true
                      additionalProperties: true
                      required:
                      - id
                      - title
                      - source
                      - published_at
                      - topics
                      - tickers
                      - sentiment_score
                      - sentiment_status
                      - event_card
                      - actions
                  count:
                    type: integer
                  limit:
                    type: integer
                  max_limit:
                    type: integer
                  next_cursor:
                    type:
                    - integer
                    - 'null'
                  filters:
                    type: object
                    properties: {}
                    additionalProperties: true
