      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 1-200, default 50
          title: Limit
        description: 1-200, default 50
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: next_cursor from the previous page
          title: Cursor
        description: next_cursor from the previous page
      - name: since_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: only headlines with a larger id
          title: Since Id
        description: only headlines with a larger id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          description: ISO 8601, published_at >=
          title: From
        description: ISO 8601, published_at >=
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          description: ISO 8601, published_at <
          title: To
        description: ISO 8601, published_at <
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Source
      - name: ticker
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 400
          - type: 'null'
          description: comma-separated symbols
          title: Ticker
        description: comma-separated symbols
      - name: topic
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Topic
      - name: sector
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Sector
      - name: lang
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 8
          - type: 'null'
          title: Lang
      - name: min_sentiment
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Sentiment
      - name: max_sentiment
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Sentiment
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Stable id, ascending in ingestion order (since_id / cursor).
                        title:
                          type: string
                          description: The headline as published.
                        url:
                          type:
                          - string
                          - 'null'
                          description: Link to the original article; bodies are not redistributed.
                        source:
                          type: string
                          description: Publisher or feed name; `Wire` for aggregated wires.
                        published_at:
                          type: string
                          description: The source's timestamp, ISO 8601.
                        ingested_at:
                          type: string
                          description: When the engine picked it up, ISO 8601.
                        language:
                          type:
                          - string
                          - 'null'
                          description: '`en` or `und`.'
                        topics:
                          type: array
                          items:
                            type: string
                          description: 'Rule-based tags: ma, stocks, crypto, global. Never empty.'
                        tickers:
                          type: array
                          items:
                            type: string
                        deal_value_usd:
                          type:
                          - number
                          - 'null'
                          description: Deal size stated in an M&A headline, USD.
                        sector:
                          type:
                          - string
                          - 'null'
                          description: Event Card keyword-rule sector of the title, null when none.
                        sector_label:
                          type:
                          - string
                          - 'null'
                        sentiment_score:
                          type:
                          - number
                          - 'null'
                          description: -1 most bearish .. +1 most bullish, from the AI headline scorer; null when not scored.
                        sentiment_status:
