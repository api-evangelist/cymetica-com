openapi: 3.2.0
info:
  title: EventTrader Public Headlines API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Headlines API
paths:
  /api/v1/headlines-api:
    get:
      tags:
      - Headlines API
      summary: About
      description: What the Headlines API is, who can use it, fields, limits, 24 h coverage. No key needed.
      operationId: about_api_v1_headlines_api_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  what:
                    type: string
                  access:
                    type: object
                    properties: {}
                    additionalProperties: true
                  endpoints:
                    type: object
                    properties: {}
                    additionalProperties: true
                  list_parameters:
                    type: object
                    properties: {}
                    additionalProperties: true
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                        meaning:
                          type: string
                      additionalProperties: true
                  coverage:
                    type:
                    - object
                    - 'null'
                    description: Share of the last 24 h of headlines carrying each field.
                  limits:
                    type: object
                    properties: {}
                    additionalProperties: true
                  event_cards:
                    type: string
                  not_included:
                    type: array
                    items:
                      type: string
                additionalProperties: true
                required:
                - name
                - access
                - fields
                - limits
      security: []
  /api/v1/headlines-api/sample:
    get:
      tags:
      - Headlines API
      summary: Public Sample
      description: Five headlines at least 60 minutes old, fixed, no filters. No key needed.
      operationId: public_sample_api_v1_headlines_api_sample_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Stable id, ascending in ingestion order (since_id / cursor).
                        title:
                          type: string
                          description: The headline as published.
                        url:
                          type:
                          - string
                          - 'null'
                          description: Link to the original article; bodies are not redistributed.
                        source:
                          type: string
                          description: Publisher or feed name; `Wire` for aggregated wires.
                        published_at:
                          type: string
                          description: The source's timestamp, ISO 8601.
                        ingested_at:
                          type: string
                          description: When the engine picked it up, ISO 8601.
                        language:
                          type:
                          - string
                          - 'null'
                          description: '`en` or `und`.'
                        topics:
                          type: array
                          items:
                            type: string
                          description: 'Rule-based tags: ma, stocks, crypto, global. Never empty.'
                        tickers:
                          type: array
                          items:
                            type: string
                        deal_value_usd:
                          type:
                          - number
                          - 'null'
                          description: Deal size stated in an M&A headline, USD.
                        sector:
                          type:
                          - string
                          - 'null'
                          description: Event Card keyword-rule sector of the title, null when none.
                        sector_label:
                          type:
                          - string
                          - 'null'
                        sentiment_score:
                          type:
                          - number
                          - 'null'
                          description: -1 most bearish .. +1 most bullish, from the AI headline scorer; null when not scored.
                        sentiment_status:
                          type: string
                          enum:
                          - scored
                          - not_scored
                        price_moves_pct:
                          type: object
                          properties: {}
                          additionalProperties:
                            type: number
                          description: '{SYMBOL: % move since the headline}'
                        event_card:
                          type:
                          - object
                          - 'null'
                          description: '{id, url} of the headline''s Event Card, if one exists.'
                        actions:
                          type: object
                          properties:
                            make_event_card:
                              type:
                              - string
                              - 'null'
                          additionalProperties: true
                      additionalProperties: true
                      required:
                      - id
                      - title
                      - source
                      - published_at
                      - topics
                      - tickers
                      - sentiment_score
                      - sentiment_status
                      - event_card
                      - actions
                  delay_minutes:
                    type: integer
                  size:
                    type: integer
                  note:
                    type: string
                  docs:
                    type: string
                additionalProperties: true
                required:
                - items
                - delay_minutes
                - size
      security: []
  /api/v1/headlines-api/headlines:
    get:
      tags:
      - Headlines API
      summary: List Headlines
      description: Headlines newest first, filtered, cursor-paginated. Needs an active paid NEXUS plan.
