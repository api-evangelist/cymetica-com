          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  generated_at:
                    type:
                    - string
                    - 'null'
                  age_seconds:
                    type:
                    - number
                    - 'null'
                  stale:
                    type: boolean
                  source:
                    type:
                    - string
                    - 'null'
                  rank_baseline_at:
                    type:
                    - string
                    - 'null'
                  rank_history_hours:
                    type: number
                  message:
                    type:
                    - string
                    - 'null'
                  symbol:
                    type: string
                  asset:
                    anyOf:
                    - type: object
                      properties:
                        symbol:
                          type: string
                        name:
                          type: string
                        image:
                          type:
                          - string
                          - 'null'
                        market_cap_rank:
                          type:
                          - integer
                          - 'null'
                        price_usd:
                          type:
                          - number
                          - 'null'
                        change_24h_pct:
                          type:
                          - number
                          - 'null'
                        pulse_score:
                          type:
                          - number
                          - 'null'
                          description: 0..100; null when no social component is computable.
                        components:
                          type: object
                          properties: {}
                          additionalProperties:
                            type: number
                          description: Component key (sentiment/buzz/momentum/price/turnover) → 0..1.
                        missing_components:
                          type: array
                          items:
                            type: string
                        mentions_24h:
                          type: integer
                        mentions_prev_24h:
                          type: integer
                        mentions_7d:
                          type: integer
                        sentiment_avg_24h:
                          type:
                          - number
                          - 'null'
                        sentiment_avg_7d:
                          type:
                          - number
                          - 'null'
                        bullish_pct_24h:
                          type:
                          - number
                          - 'null'
                        social_dominance_pct:
                          type:
                          - number
                          - 'null'
                        impact_avg_24h:
                          type:
                          - number
                          - 'null'
                        pulse_rank:
                          type: integer
                        rank_change_24h:
                          type:
                          - integer
                          - 'null'
                          description: Positive = climbed.
                        trend:
                          type: string
                          enum:
                          - up
                          - down
                          - flat
                      additionalProperties: true
                      required:
                      - symbol
                      - pulse_score
                      - pulse_rank
                    - type: 'null'
                  weights:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: number
                    description: Component weights.
                  component_labels:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                  exchange_url:
                    type:
                    - string
                    - 'null'
                  headline_count:
                    type: integer
                  headlines:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        source:
                          type:
                          - string
                          - 'null'
                        url:
                          type:
                          - string
                          - 'null'
                        event_url:
                          type:
                          - string
                          - 'null'
                        published_at:
                          type:
                          - string
                          - 'null'
                        sentiment:
                          type:
                          - number
                          - 'null'
                        impact:
                          type:
                          - number
                          - 'null'
                      additionalProperties: true
                additionalProperties: true
                required:
                - ok
                - symbol
                - asset
                - headlines
                description: One asset's score components and the recent headlines behind them; `asset` is null (with `message`) when it is outside the current universe.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/clones/social-pulse/docs:
    get:
      tags:
