openapi: 3.2.0
info:
  title: EventTrader Public Clones API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: clones
paths:
  /api/v1/clones/fomo-radar/signals:
    get:
      tags:
      - clones
      summary: Fomo Radar Signals
      description: Tokens the tracked wallets are buying right now, ranked by conviction.
      operationId: fomo_radar_signals_api_v1_clones_fomo_radar_signals_get
      parameters:
      - name: chain
        in: query
        required: false
        schema:
          type: string
          pattern: ^(robinhood|solana)$
          default: robinhood
          title: Chain
      - name: filter
        in: query
        required: false
        schema:
          type: string
          pattern: ^(all|hot|fresh|exits)$
          default: all
          title: Filter
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 40
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Fomo Radar Signals Api V1 Clones Fomo Radar Signals Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/clones/fomo-radar/traders:
    get:
      tags:
      - clones
      summary: Fomo Radar Traders
      description: Leaderboard of wallets ranked by their realized on-chain track record.
      operationId: fomo_radar_traders_api_v1_clones_fomo_radar_traders_get
      parameters:
      - name: chain
        in: query
        required: false
        schema:
          type: string
          pattern: ^(robinhood|solana)$
          default: robinhood
          title: Chain
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Fomo Radar Traders Api V1 Clones Fomo Radar Traders Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/clones/fomo-radar/calibration:
    get:
      tags:
      - clones
      summary: Fomo Radar Calibration
      description: 'The measured score -> outcome link: isotonic fit, Brier, precision, regime.


        Everything here is measured on signals this radar actually emitted and

        labeled AFTER their 72-hour window closed. Below the minimum sample count

        there is no probability at all — ``sufficient`` is false and ``headline``

        reads "insufficient history (n/N)".'
      operationId: fomo_radar_calibration_api_v1_clones_fomo_radar_calibration_get
      parameters:
      - name: chain
        in: query
        required: false
        schema:
          type: string
          pattern: ^(robinhood|solana)$
          default: robinhood
          title: Chain
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Fomo Radar Calibration Api V1 Clones Fomo Radar Calibration Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/clones/fomo-radar/docs:
    get:
      tags:
      - clones
      summary: Fomo Radar Docs
      description: Machine-readable description of the two scoring models.
      operationId: fomo_radar_docs_api_v1_clones_fomo_radar_docs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Fomo Radar Docs Api V1 Clones Fomo Radar Docs Get
      security: []
  /api/v1/clones/memecoin-terminal/tokens:
    get:
      tags:
      - clones
      summary: Memecoin Terminal Tokens
      description: Ranked memecoin rows for one tab + chain filter.
      operationId: memecoin_terminal_tokens_api_v1_clones_memecoin_terminal_tokens_get
      parameters:
      - name: tab
        in: query
        required: false
        schema:
          type: string
          default: trending
          title: Tab
      - name: chain
        in: query
        required: false
        schema:
          type: string
          default: all
          title: Chain
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Memecoin Terminal Tokens Api V1 Clones Memecoin Terminal Tokens Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/clones/memecoin-terminal/search:
    get:
      tags:
      - clones
      summary: Memecoin Terminal Search
      description: Search every indexed chain for a symbol, name or contract address.
      operationId: memecoin_terminal_search_api_v1_clones_memecoin_terminal_search_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
          default: ''
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Memecoin Terminal Search Api V1 Clones Memecoin Terminal Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/clones/memecoin-terminal/docs:
    get:
      tags:
      - clones
      summary: Memecoin Terminal Docs
      description: Machine-readable description of this clone's public API.
      operationId: memecoin_terminal_docs_api_v1_clones_memecoin_terminal_docs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Memecoin Terminal Docs Api V1 Clones Memecoin Terminal Docs Get
      security: []
  /api/v1/clones/social-pulse/assets:
    get:
      tags:
      - clones
      summary: Social Pulse Assets
      description: Ranked Pulse table. Always answers from the cached snapshot.
      operationId: social_pulse_assets_api_v1_clones_social_pulse_assets_get
      parameters:
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^(pulse|mentions|sentiment|price|rank_change)$
          default: pulse
          title: Sort
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 250
          minimum: 1
          default: 100
          title: Limit
      - name: trend
        in: query
        required: false
        schema:
          type: string
          pattern: ^(all|up|down)$
          default: all
          title: Trend
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  generated_at:
                    type:
                    - string
                    - 'null'
                  age_seconds:
                    type:
                    - number
                    - 'null'
                  stale:
                    type: boolean
                  source:
                    type:
                    - string
                    - 'null'
                  rank_baseline_at:
                    type:
                    - string
                    - 'null'
                  rank_history_hours:
                    type: number
                  message:
                    type:
                    - string
                    - 'null'
                  sort:
                    type: string
                  trend:
                    type: string
                  count:
                    type: integer
                  universe:
                    type: integer
                  assets_with_mentions:
                    type:
                    - integer
                    - 'null'
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        name:
                          type: string
                        image:
                          type:
                          - string
                          - 'null'
                        market_cap_rank:
                          type:
                          - integer
                          - 'null'
                        price_usd:
                          type:
                          - number
                          - 'null'
                        change_24h_pct:
                          type:
                          - number
                          - 'null'
                        pulse_score:
                          type:
                          - number
                          - 'null'
                          description: 0..100; null when no social component is computable.
                        components:
                          type: object
                          properties: {}
                          additionalProperties:
                            type: number
                          description: Component key (sentiment/buzz/momentum/price/turnover) → 0..1.
                        missing_components:
                          type: array
                          items:
                            type: string
                        mentions_24h:
                          type: integer
                        mentions_prev_24h:
                          type: integer
                        mentions_7d:
                          type: integer
                        sentiment_avg_24h:
                          type:
                          - number
                          - 'null'
                        sentiment_avg_7d:
                          type:
                          - number
                          - 'null'
                        bullish_pct_24h:
                          type:
                          - number
                          - 'null'
                        social_dominance_pct:
                          type:
                          - number
                          - 'null'
                        impact_avg_24h:
                          type:
                          - number
                          - 'null'
                        pulse_rank:
                          type: integer
                        rank_change_24h:
                          type:
                          - integer
                          - 'null'
                          description: Positive = climbed.
                        trend:
                          type: string
                          enum:
                          - up
                          - down
                          - flat
                      additionalProperties: true
                      required:
                      - symbol
                      - pulse_score
                      - pulse_rank
                additionalProperties: true
                required:
                - ok
                - count
                - assets
                description: Ranked Pulse table from the cached snapshot (`ok=false` + `message` while it rebuilds).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/clones/social-pulse/assets/{symbol}:
    get:
