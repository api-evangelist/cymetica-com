                        apy_base:
                          type: number
                        apy_reward:
                          type: number
                        apy_mean_30d:
                          type:
                          - number
                          - 'null'
                        apy_change_7d:
                          type:
                          - number
                          - 'null'
                        convex_pool_id:
                          type:
                          - string
                          - 'null'
                        convex_apy:
                          type:
                          - number
                          - 'null'
                        convex_apy_base:
                          type:
                          - number
                          - 'null'
                        convex_apy_reward:
                          type:
                          - number
                          - 'null'
                        convex_tvl_usd:
                          type:
                          - number
                          - 'null'
