openapi: 3.2.0
info:
  title: EventTrader Public Features API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Features
paths:
  /api/v1/features:
    get:
      tags:
      - Features
      summary: List Features
      description: List all feature requests with pagination and filters.
      operationId: list_features_api_v1_features_get
      security: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Per Page
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          pattern: ^(bids|raised|score|created_at|upvotes)$
          default: bids
          title: Sort By
      - name: order
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          default: desc
          title: Order
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/features/leaderboard:
    get:
      tags:
      - Features
      summary: Get Leaderboard
      description: 'The Feature Leaderboard. Public.


        `sort=top` (the default) is the ranking: open features by the ET10 bid on them, then

        by votes; shipped features last. Each entry carries `bid_total_et10`, `bid_count`,

        `bid_usd_value` and `bid_rank_et10`. `hot`, `rising` and `new` are vote/recency views.


        This endpoint is shared beyond `/leaderboard/features` (documented public API,

        other admin surfaces) — its default response shape is never trimmed. Pass

        `fields=list` to get the slim shape the board''s own list rendering re-fetches

        (used by feature_leaderboard.html after the initial SSR paint); everyone else

        keeps the full entry, including `description` and `username`.


        Args:

        period: Time period filter (daily, weekly, all_time)

        limit: Maximum number of entries to return

        category: Filter by category (feature, reward, incentive, improvement)

        status: Filter by status (pending, reviewing, approved, implementing, completed)

        channel: Filter by source channel (telegram, discord, web, github, api)'
      operationId: get_leaderboard_api_v1_features_leaderboard_get
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          pattern: ^(daily|weekly|all_time)$
          default: all_time
          title: Period
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^(hot|rising|new|top)$
          default: top
          title: Sort
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(pending|reviewing|approved|implementing|qa_testing|completed)$
          - type: 'null'
          title: Status
      - name: channel
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(telegram|discord|web|github|api|linear)$
          - type: 'null'
          title: Channel
      - name: fields
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(list)$
          - type: 'null'
          description: fields=list returns a slim entry (no description/username) for a board-list rendering — the default (omitted) shape is unchanged for every other caller.
          title: Fields
        description: fields=list returns a slim entry (no description/username) for a board-list rendering — the default (omitted) shape is unchanged for every other caller.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/src__schemas__features__LeaderboardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/features/bidding/rules:
    get:
      tags:
      - Features
      summary: Bidding Rules
      description: How bidding works, the smallest bid and the ET10 price it is worked out from. Public.
      operationId: bidding_rules_api_v1_features_bidding_rules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: string
                    description: How bidding works, in the words the site uses.
                  min_bid_usd:
                    type: number
                  min_bid_et10:
                    type: number
                    description: Smallest first bid on a feature, in ET10. Read it; never hardcode it.
                  et10_price_usd:
                    type: number
                    description: The ET10 price the minimum is worked out from.
                  min_holding_et10:
                    type: number
                    description: ET10 the account must hold to bid. A holding; a bid is never collected.
                  collected:
                    type: boolean
                    description: 'Always false: a bid is never charged, locked or paid.'
                  get_et10:
                    type: string
                  board:
                    type: string
                additionalProperties: true
                required:
                - rules
                - min_bid_usd
                - min_bid_et10
                - et10_price_usd
      security: []
  /api/v1/features/bids/mine:
    get:
      tags:
      - Features
      summary: My Feature Bids
      description: Your standing bid on each feature, and how much ET10 that commits on open features.
      operationId: my_feature_bids_api_v1_features_bids_mine_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  bids:
                    type: object
                    additionalProperties:
                      type: string
                    description: 'Your standing bid per feature: {feature_id: amount_et10}.'
                  standing_on_open_features_et10:
                    type: number
                    description: ET10 your standing bids commit on features that are still open.
                additionalProperties: true
                required:
                - bids
                - standing_on_open_features_et10
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
  /api/v1/features/{feature_id}/bids:
    get:
      tags:
      - Features
      summary: Feature Bid Summary
      description: A feature's bid total, number of bidders and highest bid. Never who bid what. Public.
      operationId: feature_bid_summary_api_v1_features__feature_id__bids_get
      parameters:
      - name: feature_id
        in: path
        required: true
        schema:
          type: integer
          title: Feature Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature_id:
                    type: integer
                  open_for_bids:
                    type: boolean
                    description: False once a feature has shipped or been closed; a bid on it is refused.
                  bid_total_et10:
                    type: number
                    description: ET10 bid on this feature (each account's standing bid, summed).
                  bid_count:
                    type: integer
                    description: How many accounts have bid. Never who.
                  highest_bid_et10:
                    type: number
                  bid_usd_value:
                    type: number
                  bid_rank_et10:
                    type: number
                    description: 'What the board ranks by: ET10 bid plus dollars already raised, at the ET10 price.'
                  min_bid_et10:
                    type: number
                  min_bid_usd:
                    type: number
                  et10_price_usd:
                    type: number
                  min_holding_et10:
                    type: number
                    description: ET10 the account must hold to bid. A holding; a bid is never collected.
                  collected:
                    type: boolean
                    description: 'Always false: a bid is never charged, locked or paid.'
                additionalProperties: true
                required:
                - feature_id
                - open_for_bids
                - bid_total_et10
                - bid_count
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/features/{feature_id}/bid:
    post:
      tags:
      - Features
      summary: Bid On Feature
      description: 'Place or raise your ET10 bid on a feature. Raise only. Never collected; the account must hold 100,000 ET10.


        Signed-in session or X-API-Key, so an agent can bid for its account.'
      operationId: bid_on_feature_api_v1_features__feature_id__bid_post
      security:
      - BearerJWT: []
      - ApiKeyAuth: []
      parameters:
      - name: feature_id
        in: path
        required: true
        schema:
          type: integer
          title: Feature Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureBidIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature_id:
                    type: integer
                  your_bid_et10:
                    type: number
                  raised_from_et10:
                    type:
                    - number
                    - 'null'
                    description: Your previous standing bid, null for a first bid.
                  bid_total_et10:
                    type: number
                  bid_count:
                    type: integer
                  bid_usd_value:
                    type: number
                  bid_rank_et10:
                    type: number
                  message:
                    type: string
                additionalProperties: true
                required:
                - feature_id
                - your_bid_et10
                - bid_total_et10
                - bid_count
                - message
                description: The bid stands. Nothing was charged or locked. A refusal is a 422 whose `detail` says why.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
