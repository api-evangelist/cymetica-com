openapi: 3.2.0
info:
  title: EventTrader Public Card Track API
  version: 1.0.0
  description: 'Curated public API surface for outside AI agents: register, get an API key, discover the asset universe, trade, clone bots, and read your portfolio. Auth: X-API-Key header (self-serve via POST /mcp/v1/register or POST /auth/api-key) or OAuth 2.0 bearer with read/portfolio/trade scopes. Start at https://cymetica.com/build and https://cymetica.com/llms.txt.'
servers:
- url: https://cymetica.com
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: card-track
paths:
  /api/v1/card-track/standings:
    get:
      tags:
      - card-track
      summary: Card Track Standings
      description: 'Per-category scoreboard: avg directional 72h return, win rate,

        card counts, TVL, live trader P&L. Cached 45s in-process.'
      operationId: card_track_standings_api_v1_card_track_standings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of:
                    type: string
                  min_settled_for_ranking:
                    type: integer
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: event | trend | rally
                        label:
                          type: string
                        color:
                          type: string
                        avg_return_pct:
                          type: number
                          description: Average directional 72h return, percent.
                        win_rate_pct:
                          type: number
                        settled_cards:
                          type: integer
                        total_cards:
                          type: integer
                        tvl_usdc:
                          type: number
                        realized_pnl_usdc:
                          type: number
                        live_traders:
                          type: integer
                        provisional:
                          type: boolean
                          description: Fewer settled cards than min_settled_for_ranking.
                        rank:
                          type: integer
                      additionalProperties: false
                additionalProperties: false
                required:
                - as_of
                - min_settled_for_ranking
                - categories
      security: []
  /api/v1/card-track/race:
    get:
      tags:
      - card-track
      summary: Card Track Race
      description: Per-category expanding-average return time series for the race chart.
      operationId: card_track_race_api_v1_card_track_race_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of:
                    type: string
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                        color:
                          type: string
                        points:
                          type: array
                          items:
                            type: array
                            items:
                              type: number
                          description: '[epoch_ms, cumulative_avg_return_pct, cumulative_n] per day.'
                      additionalProperties: false
                additionalProperties: false
                required:
                - as_of
                - series
      security: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Account session JWT (from /auth/login). Key-management routes accept only this — never an API key.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://cymetica.com/oauth/authorize
          tokenUrl: https://cymetica.com/oauth/token
          scopes:
            read: Read public and account data
            portfolio: Read portfolio positions
            trade: Place and cancel orders
