components:
  schemas:
    JoinIn:
      properties:
        buyin:
          type: number
          maximum: 1000.0
          exclusiveMinimum: 0.0
          title: Buyin
          description: 5 or 50 (paper USDC tables), 100 or 1000 (ET10 tables)
          default: 5
        currency:
          type: string
          pattern: ^(?i:usdc|et10)$
          title: Currency
          description: USDC (paper buy-in) or ET10 (real ET10 buy-in)
          default: USDC
        flash:
          type: boolean
          title: Flash
          description: true for a 1-day Flash table (USDC buy-ins only)
          default: false
