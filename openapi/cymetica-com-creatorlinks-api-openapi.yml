components:
  schemas:
    ChannelPostBody:
      properties:
        symbol:
          type: string
          maxLength: 32
          title: Symbol
        platform:
          type: string
          maxLength: 8
          title: Platform
        message:
          type: string
          maxLength: 400
          title: Message
          default: ''
        kind:
          type: string
          maxLength: 16
          title: Kind
          default: terminal
      type: object
      required:
      - symbol
      - platform
      title: ChannelPostBody
    PostedBody:
      properties:
        reply_url:
          type: string
          maxLength: 400
          title: Reply Url
          default: ''
      type: object
      title: PostedBody
    CreateArtifactBody:
      properties:
        surface:
          type: string
          maxLength: 300
          title: Surface
        headline:
          type: string
          maxLength: 120
          title: Headline
          default: ''
        pitch:
          type: string
          maxLength: 600
          title: Pitch
          default: ''
      type: object
      required:
      - surface
      title: CreateArtifactBody
    JournalistPitchBody:
      properties:
        pitch_text:
          type: string
          maxLength: 8000
          title: Pitch Text
          default: ''
        article_url:
          type: string
          maxLength: 1000
          title: Article Url
          default: ''
      type: object
      title: JournalistPitchBody
    RecordUrlBody:
      properties:
        target_url:
          type: string
          maxLength: 2000
          title: Target Url
      type: object
      required:
      - target_url
      title: RecordUrlBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RadarChannelPostBody:
      properties:
        slug:
          type: string
          maxLength: 32
          title: Slug
        handle:
          type: string
          maxLength: 120
          title: Handle
      type: object
      required:
      - slug
      - handle
      title: RadarChannelPostBody
    ClaimBody:
      properties:
        link_slug:
          type: string
          maxLength: 16
          title: Link Slug
          default: ''
      type: object
      title: ClaimBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    CreateLinkBody:
      properties:
        target_url:
          type: string
          maxLength: 2000
          title: Target Url
        title:
          type: string
          maxLength: 200
          title: Title
          default: ''
        kind:
          type: string
          maxLength: 24
          title: Kind
          default: other
      type: object
      required:
      - target_url
      title: CreateLinkBody
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Account session JWT (from /auth/login). Key-management routes accept only this — never an API key.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://cymetica.com/oauth/authorize
          tokenUrl: https://cymetica.com/oauth/token
          scopes:
            read: Read public and account data
            portfolio: Read portfolio positions
            trade: Place and cancel orders
