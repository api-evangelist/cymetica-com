                    - 'null'
                additionalProperties: true
                required:
                - id
                - permalink
                - body
                - relevance
                - surface
                - status
                - tweet_id
                description: 'One thread where a reply with the creator''s page fits. `permalink` opens it, `body` is the text (first 600 chars), `relevance` the crawler''s score, `surface`/`surface_name` the site surface the thread is about, `tool_path`/`tool_name` the best-matching page to reply with (vector match `tool_score`), `suggested_reply` the drafted reply once claimed via /reply. A claimed lead carries its OWN tracked link: `reply_slug`, `tracked_url` (https://cymetica.com/c/<reply_slug>) and the page it points at (`reply_page_slug`, `reply_page_name`), bound to the page picked on that card. `suggested_reply` is usable at once; while `reply_drafting` is true a reply written from the thread''s own text is still being prepared — GET /{platform}-leads/{id} again after a minute or two and use the newer `suggested_reply` when it changes. `?tool=` narrows the queue to one site surface (unknown tool → 400); `?status=claimed,replied` lists your own claimed/replied leads instead of the open queue (unknown status → 400).'
