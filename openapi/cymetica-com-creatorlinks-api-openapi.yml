                    - 'null'
                  reply_page_name:
                    type:
                    - string
                    - 'null'
                  reward_status:
                    type:
                    - string
                    - 'null'
                  reward_note:
                    type:
                    - string
                    - 'null'
                  reply_drafting:
                    type: boolean
                  tweet_id:
                    type: string
                  group_key:
                    type: string
                  group_name:
                    type: string
                  author_followers:
                    type:
                    - number
                    - 'null'
                  likes:
                    type:
                    - number
                    - 'null'
                  replies:
                    type:
                    - number
                    - 'null'
                  impressions:
                    type:
