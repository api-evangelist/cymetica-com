apis:
- name: EventTrader Public API
  description: 'Curated public REST surface of EventTrader, Cymetica''s perpetual prediction market and CLOB exchange: register
    and mint API keys, OAuth 2.0 (PKCE) token flows, list markets and exchange pairs, read orderbooks/trades/tickers, place,
    amend and cancel CLOB and per-pair orders (Idempotency-Key on the exchange router), trade EVCDX event-card index baskets,
    clone and fund AI trading bots, run backtests, launch and quote bonding-curve tokens, and read portfolio positions and
    deposit addresses. OpenAPI 3.1.0, 114 operations, served from https://cymetica.com/openapi-public.json. Paper mode on
    every order; users pay their own gas.'
  humanURL: https://cymetica.com/api-docs
  baseURL: https://cymetica.com/api/v1
