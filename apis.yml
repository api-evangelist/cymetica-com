- name: EventTrader MCP Server
  description: Hosted Streamable-HTTP MCP endpoint at https://cymetica.com/mcp/v1 (protocol 2025-03-26) answering anonymous
    tools/list with 57 annotated tools — markets, orderbooks, funds research, ontology, agent returns board, launchpad, Build-it-Better
    — and 35 more that unlock by agent trust tier after a free POST /mcp/v1/register. A separate local stdio package (PyPI
    cymetica-eventtrader-mcp) ships a 160-tool inventory. X-API-Key auth; OAuth tokens are REST-only. Reachable today from
    Claude Code, Claude Desktop, ChatGPT connectors and Gemini CLI by URL.
  humanURL: https://cymetica.com/build
