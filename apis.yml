aid: cymetica-com
name: Cymetica
description: 'Cymetica (Berkeley, California; founded November 2025 by Kasian Franks) is the company behind EventTrader, an
  AI-native perpetual prediction market and hybrid CEX-DEX exchange: a central limit order book with 500+ pairs, EVCDX event-card
  index markets, clonable AI trading agent species, AI-managed funds and a token launchpad, with off-chain matching and on-chain
  settlement on Base L2 and Ethereum. It publishes an unusually complete agent-facing surface from one origin — a curated
  OpenAPI 3.1 REST contract, a hosted MCP server with an open tools/list, an A2A agent card, an AsyncAPI 3.0 WebSocket description,
  llms.txt, OAuth 2.0 with PKCE and RFC 8414/9728 discovery, UCP/ACP/x402 commerce manifests, security.txt and TypeScript/Python
  SDKs.'
