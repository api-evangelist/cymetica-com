generated: '2026-09-19'
method: probed
source: live GET probes of the closed /.well-known/ path list on every host the record knows, 2026-09-19
summary: 'Cymetica serves an unusually complete discovery surface from ONE origin: RFC 9116 security.txt, RFC 8414
  authorization-server metadata (with an RFC 7591 registration_endpoint and S256 PKCE), RFC 9728 protected-resource
  metadata, an OpenAI ai-plugin.json, an A2A agent card at both the canonical and legacy paths, two MCP discovery
  documents, a UDC master index, UCP/ACP agentic-commerce manifests, an x402 payment manifest, an Agent Skills index,
  a WebMCP card and an AsyncAPI 3.0.0 document. Misses are real JSON 404s: openid-configuration, api-catalog, aauth-resource.json
  and every APIs.json location.'
pointer_basis: WellKnown pointer emitted on the strength of the 200s above; SecurityTxt pointer emitted because
  /.well-known/security.txt is a real RFC 9116 file (Contact, Expires 2026-12-31, Canonical, Policy). Neither is
  a presence-by-file claim — every hit parses.
host_set_note: cymetica.com is simultaneously the registrable domain, the OpenAPI servers[] host, the MCP server
  host (https://cymetica.com/mcp/v1), the A2A card host and the OAuth authorization server (issuer https://cymetica.com;
  authorization_servers in the protected-resource doc names the same host), so RFC 9728 metadata and the auth-server
  metadata live on the primary host rather than a separate mcp.* or auth host. www.cymetica.com and api.cymetica.com
  resolve to the same application and serve byte-identical documents. docs.cymetica.com, mcp.cymetica.com and app.cymetica.com
  do not resolve (NXDOMAIN).
false_positive_watch: 'The /.well-known/agent-card.json 200 is a served document, not a catch-all: sibling paths
  on the same host (openid-configuration, api-catalog, aauth-resource.json, apis.json) return a 22-byte JSON 404,
  and the card body is a 21 KB JSON object with AgentCard shape.'
