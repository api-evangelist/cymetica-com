summary: Cymetica ships BOTH a hosted remote MCP endpoint and a local stdio package, and they are different inventories.
  The remote endpoint https://cymetica.com/mcp/v1 answered an anonymous initialize with protocolVersion 2025-03-26
  (serverInfo eventtrader-mcp 1.0.0) and an anonymous tools/list with 57 tools, every one carrying an inputSchema
  and MCP tool annotations (readOnlyHint/destructiveHint/idempotentHint/openWorldHint); the provider's manifest
  declares 92 tools, the remaining 35 unlocking by trust tier after registration. The local package cymetica-eventtrader-mcp
  (PyPI 1.1.1, 2026-07-30) is documented as a 160-tool server that runs DeFi/CEX connectors in the user's own process
  with the user's own keys.
deployment:
  mode: both
  endpoint: https://cymetica.com/mcp/v1
  transport: streamable-http (stateless JSON-RPC over POST; the /build page also documents `npx mcp-remote https://cymetica.com/mcp/v1`
    as a stdio bridge)
  install: uvx cymetica-eventtrader-mcp
  package: https://pypi.org/project/cymetica-eventtrader-mcp/
  package_version: 1.1.1
  package_published: '2026-07-30'
  package_env: EVENT_TRADER_API_KEY
  auth: api-key
  auth_note: Anonymous callers (trust level "unknown") get the 57 public tools with no credentials; X-API-Key (an
    mcp_-prefixed key from POST /mcp/v1/register, free and instant) unlocks tiers recognized -> trusted -> allied.
    OAuth 2.0 bearer tokens work on the REST API but NOT on /mcp/v1 (manifest authentication.oauth.note). The RFC
    9728 protected-resource document on the same host names https://cymetica.com as the authorization server.
  verified: probed
  client_recipes:
    claude_code: claude mcp add --transport http eventtrader https://cymetica.com/mcp/v1
    claude_desktop_or_claude_ai: Settings -> Connectors -> Add custom connector -> https://cymetica.com/mcp/v1
    gemini_cli: '{"mcpServers": {"eventtrader": {"httpUrl": "https://cymetica.com/mcp/v1"}}}'
    stdio_local: '{"mcpServers": {"cymetica-ai": {"command": "uvx", "args": ["cymetica-eventtrader-mcp"], "env":
      {"EVENT_TRADER_API_KEY": "your_key"}}}}'
    claude_code_plugin: /plugin marketplace add https://cymetica.com/static/plugins/marketplace.json ; /plugin install
      eventtrader-funds@cymetica
server:
  name: eventtrader-mcp
  version: 1.0.0
  transport: http
  url: https://cymetica.com/mcp/v1
  negotiated_protocol_version: '2025-03-26'
  declared_protocol_in_manifest: mcp-2024-11-05
  capabilities_from_initialize:
    tools:
      listChanged: false
    resources: {}
  capabilities_endpoint: https://cymetica.com/mcp/v1/capabilities
  registration_endpoint: https://cymetica.com/mcp/v1/register
  tools_get_endpoint: https://cymetica.com/mcp/v1/tools (tools_by_tier view)
  resources_declared:
  - eventtrader://markets
  - eventtrader://portfolio/{user_id}
  - eventtrader://prices
  - eventtrader://clob/pairs
  - eventtrader://otc/stocks
trust_ladder:
  source: MCP tools/call get_trust_ladder (public), 2026-09-19
  levels:
  - name: unknown
    rank: 0
    unlocks: Public read tools only
  - name: recognized
    rank: 1
    score_threshold: 0
    unlocks: authenticated account reads, knowledge queries, contribution tools, full money loop (deposit, CLOB
      trading via REST, withdrawal)
  - name: trusted
    rank: 2
    score_threshold: 100
    unlocks: advanced data/contribution tools
  - name: allied
    rank: 3
    score_threshold: 500
    unlocks: batch orders, webhooks, price subscriptions, AIB fund creation
  note: Volume counters cap; allied requires real track record (signal win rate, real CLOB fills, human-validated
    contributions).
tool_count:
