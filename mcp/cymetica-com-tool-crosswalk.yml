  per row.
purpose: 'Bind each agent-facing MCP tool to the REST operationId(s) that back it so the tool inherits a real parameters+requestBody
  contract from the spec, and expose where the MCP, REST and WebSocket surfaces DIVERGE: the remote MCP server is
  mostly a read/research surface with a preflight-only place_order, the money legs execute over REST, and a large
  part of the MCP inventory (ontology, agent board, funds, Build-it-Better, launchpad on Sui) has no public REST
  contract at all.'
