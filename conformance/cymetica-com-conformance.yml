domain_standard:
  found: false
  checked: '2026-09-19'
  note: REWARD-ONLY check; nothing invented. The contract declares no market-domain standard (no FIX/FIXatdl, no
    ISO 20022, no OpenRTB/SCIM/OData shape). Its on-chain surfaces reference ERC-20 and ERC-4626 (strategy vaults
    on /api-docs) and the AsyncAPI names Base/Ethereum chains, but the API contract itself does not expose a standardised
    schema an integrator could speak without a bespoke connector; the docs' "Kalshi-compatible" cursor pagination
    is a vendor pattern, not a standard.
