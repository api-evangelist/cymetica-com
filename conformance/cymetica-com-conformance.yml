    response_types code, token_endpoint_auth_methods none/client_secret_post/client_secret_basic.
- id: oauth2-pkce
  conforms: true
  evidence: 'code_challenge_methods_supported: ["S256"] in /.well-known/oauth-authorization-server.'
- id: rfc8414-authorization-server-metadata
  conforms: true
  evidence: GET https://cymetica.com/.well-known/oauth-authorization-server -> 200, issuer https://cymetica.com,
    saved at well-known/cymetica-com-oauth-authorization-server.json.
- id: rfc9728-protected-resource-metadata
  conforms: true
  evidence: GET https://cymetica.com/.well-known/oauth-protected-resource -> 200; resource https://cymetica.com,
